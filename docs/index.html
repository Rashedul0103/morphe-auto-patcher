<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patch Manager</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&display=swap">
<style>
:root {
  --primary: #E34A70; --bg: #101116; --card: #1C1E29; --card-high: #242633; --sv: #424451;
  --on: #F1F0F7; --out: #A5A7B5; --ok: #8BD8B5; --err: #F27782; --sec: #C4C5D1; --warn: #FDBA74;
  --pc: color-mix(in srgb, var(--primary) 22%, var(--bg));
  --onp: #FFFFFF;
  --fs: 16px;
}
:root.black { --bg: #000; --card: #111214; --card-high: #1c1d21; }
:root.light {
  --bg: #FDFCFF; --card: #eef0f6; --card-high: #e2e5ee; --sv: #dfe2eb; --on: #1A1C1E; --out: #73777F;
  --sec: #545F71; --onp: #fff; --ok: #286C2A; --err: #BA1A1A; --warn: #7C5800;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: var(--fs); }
body { font-family: Roboto, system-ui, sans-serif; background: var(--bg); color: var(--on); min-height: 100dvh; user-select: none; }
.ms { font-family: 'Material Symbols Outlined'; font-size: 24px; line-height: 1; font-style: normal; display: inline-block; vertical-align: middle; }
#bg { position: fixed; inset: 0; z-index: 0; opacity: 0.45; pointer-events: none; width: 100%; height: 100%; }
#main { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 16px 120px; }

/* Header & Top Bar */
.top { display: flex; align-items: center; gap: 10px; padding: 14px 0; position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #8D274D); display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #fff; flex: none; box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 26%, transparent); }
.top h1 { font-size: 1.25rem; font-weight: 500; flex: 1; }
.top small { display: block; font-size: 0.72rem; color: var(--out); font-weight: 400; }
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--on); display: grid; place-items: center; cursor: pointer; flex: none; }
.ib:hover { background: #8883; }

/* App Cards */
.card { background: var(--card); border-radius: 24px; padding: 14px; margin-bottom: 10px; border: 1px solid #8882; position: relative; }
.banner { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #0d3a6d, #0a5959); color: #fff; border-radius: 24px; padding: 14px; margin-bottom: 12px; }
.banner .s { font-size: 0.78rem; opacity: 0.75; }
.grid { display: grid; gap: 10px; }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }

.swipe-box { position: relative; overflow: visible; border-radius: 24px; margin-bottom: 10px; }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-weight: 700; font-size: 0.9rem; border-radius: 24px; z-index: 0; }
.swipe-bg.left { background: var(--err); color: #000; justify-content: flex-end; }
.swipe-bg.right { background: var(--primary); color: var(--onp); justify-content: flex-start; }
.swipe-front { position: relative; background: var(--card); border-radius: 24px; padding: 14px; border: 1px solid #8882; transition: transform 0.15s ease-out; touch-action: pan-y; z-index: 1; }

.app { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; flex: none; font-weight: 700; font-size: 1.4rem; overflow: hidden; position: relative; }
.ico img { width: 100%; height: 100%; padding: 4px; object-fit: contain; object-position: center; display: block; }
.n { font-weight: 500; display: flex; gap: 4px; align-items: center; }
.mono { font: 0.72rem ui-monospace, monospace; color: var(--out); word-break: break-all; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; padding: 3px 8px; border-radius: 8px; background: var(--sv); margin: 4px 4px 0 0; }
.chip.ok { background: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
.chip.bad { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--err); }
.chip.p { background: var(--pc); color: var(--primary); }
.chip.warn { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn); }

/* Buttons & Menu */
.pill { border: 0; border-radius: 20px; padding: 8px 16px; background: var(--primary); color: var(--onp); font: 500 0.88rem Roboto; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.t { background: none; color: var(--primary); }
.pill.o { background: none; color: var(--primary); border: 1px solid var(--out); }
.pill.d { background: var(--err); color: #000; }
.pill:disabled { opacity: 0.4; cursor: default; }

.menu-wrap { position: relative; display: inline-block; }
.menu-pop { position: absolute; right: 0; top: 100%; background: var(--card-high); border: 1px solid #8884; border-radius: 16px; padding: 6px; min-width: 220px; z-index: 25; box-shadow: 0 8px 24px #0008; display: none; flex-direction: column; gap: 2px; }
.menu-pop.on { display: flex; }
.menu-item { padding: 9px 12px; border-radius: 10px; font-size: 0.82rem; color: var(--on); text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 0; background: none; width: 100%; text-align: left; }
.menu-item[hidden] { display: none; }
.menu-item:hover { background: #8882; }
.menu-item .ms { font-size: 18px; color: var(--primary); }

/* Bottom Dock */
#dock { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 8; display: flex; gap: 4px; background: var(--card); border: 1px solid #8883; border-radius: 32px; padding: 6px; box-shadow: 0 6px 24px #0007; }
.bb { display: flex; flex-direction: column; align-items: center; min-width: 68px; padding: 8px 8px 6px; border-radius: 24px; border: 0; background: none; color: var(--on); font: 500 0.7rem Roboto; cursor: pointer; gap: 2px; }
.bb.hl { background: var(--pc); color: var(--primary); }
@media (min-width: 900px) {
  #dock { left: 14px; top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; border-radius: 32px; }
  #main { margin-left: max(104px, calc(50vw - 480px + 52px)); }
}

/* Forms & Dialogs */
input[type=text], input[type=password], input[type=number], input[type=search], select { width: 100%; min-width: 0; padding: 12px 16px; border-radius: 24px; border: 1px solid var(--out); background: var(--card-high); color: var(--on); font: 1rem Roboto, system-ui, sans-serif; outline: 0; }
input[type=color] { display: block; width: 100%; height: 48px; margin-top: 6px; padding: 5px 8px; border: 1px solid var(--out); border-radius: 14px; background: var(--card-high); cursor: pointer; }
input:focus, select:focus { border-color: var(--primary); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [role="button"]:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 75%, white); outline-offset: 3px; }
.lbl { font-size: 0.75rem; color: var(--sec); margin: 10px 4px 4px; }
.sw { position: relative; width: 52px; height: 30px; border-radius: 15px; background: var(--sv); border: 2px solid var(--out); flex: none; cursor: pointer; transition: 0.2s; }
.sw::after { content: ""; position: absolute; top: 5px; left: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--out); transition: 0.2s; }
.sw.on { background: var(--primary); border-color: var(--primary); }
.sw.on::after { left: 25px; top: 3px; width: 24px; height: 24px; background: var(--onp); }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.row .g { flex: 1; min-width: 0; }
.row .d { font-size: 0.78rem; color: var(--out); margin-top: 2px; }

.dlg-bg { position: fixed; inset: 0; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: #0009; z-index: 30; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.dlg-bg.on { display: flex; }
.dlg { background: var(--card); width: min(600px, 100%); max-height: 90vh; max-height: 90dvh; overflow-y: auto; overscroll-behavior: contain; border-radius: 28px; padding: 22px; border: 1px solid #8883; box-shadow: 0 10px 30px #000a; }
.dlg h2 { font-size: 1.25rem; font-weight: 500; margin-bottom: 6px; }
.dlg p { font-size: 0.85rem; color: var(--sec); margin-bottom: 12px; }
.dlg-actions { position: sticky; bottom: -22px; z-index: 2; display: flex; justify-content: flex-end; gap: 8px; margin: 4px -22px -22px; padding: 12px 22px max(14px, env(safe-area-inset-bottom)); border-top: 1px solid #8883; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); }

.toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: #e3e2e6; color: #1a1c1e; padding: 10px 20px; border-radius: 14px; font-size: 0.85rem; z-index: 60; opacity: 0; transition: 0.25s; pointer-events: none; max-width: 92vw; box-shadow: 0 4px 14px #0006; }
.toast.on { opacity: 1; } .toast.bad { background: #ffb4ab; color: #000; }
.fab { position: fixed; right: 16px; bottom: 96px; z-index: 9; box-shadow: 0 6px 20px #0008; padding: 14px 22px; }
@media (min-width: 900px) { .fab { bottom: 24px; right: 24px; } }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); animation: p 1.6s infinite; flex: none; }
@keyframes p { 50% { opacity: 0.3; } }
.wavy-bar { height: 12px; border-radius: 6px; background: var(--sv); overflow: hidden; margin: 12px 0; }
.wavy-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), #8D274D, #F49AB0); background-size: 200%; animation: sh 1.5s linear infinite; transition: width 0.3s; }
@keyframes sh { to { background-position: -200%; } }
#term { background: #0a0b0c; color: #e3e2e6; border-radius: 16px; padding: 12px; font: 0.75rem/1.5 ui-monospace, monospace; max-height: 320px; overflow-y: auto; margin-top: 10px; }
.INFO { color: #8ab4f8; } .SUCCESS { color: #90D889; } .ERROR { color: #FFB4AB; }

.status-card { background: var(--card-high); border: 1px solid #8882; border-radius: 20px; padding: 14px; margin: 10px 0; }
.build-collapsible { padding: 0; overflow: hidden; }
.build-collapsible > summary { list-style: none; cursor: pointer; padding: 14px; }
.build-collapsible > summary::-webkit-details-marker { display: none; }
.build-collapsible[open] > summary { border-bottom: 1px solid #8882; }
.build-collapsible .status-title { width: 100%; }
.expand-icon { transition: transform .18s ease; color: var(--out); flex: none; }
.build-collapsible[open] .expand-icon { transform: rotate(180deg); }
.collapsible-content { padding: 0 14px 14px; }
.status-title { display:flex; align-items:center; gap:8px; font-weight:500; }
.status-icon { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--sv); color:var(--on); flex:none; }
.status-icon.ok { background:color-mix(in srgb,var(--ok) 25%,transparent); color:var(--ok); }
.status-icon.warn { background:color-mix(in srgb,var(--warn) 25%,transparent); color:var(--warn); }
.status-icon.bad { background:color-mix(in srgb,var(--err) 22%,transparent); color:var(--err); }
.step-list { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
.step { display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--out); }
.step.current { color:var(--on); font-weight:500; }
.step.done { color:var(--ok); }
.step-dot { width:8px; height:8px; border-radius:50%; background:var(--sv); flex:none; }
.step.current .step-dot { background:var(--primary); box-shadow:0 0 0 4px var(--pc); }
.step.done .step-dot { background:var(--ok); }
.action-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.app-hero { display:flex; gap:12px; align-items:center; }
.app-hero .hero-copy { flex:1; min-width:0; }
.hero-action { width:100%; justify-content:center; margin-top:8px; }
@media (min-width:700px) { .hero-action { width:auto; margin-top:0; } }
.file-drop { border:1px dashed var(--out); border-radius:20px; padding:22px 16px; text-align:center; background:color-mix(in srgb,var(--card-high) 70%,transparent); }
.file-drop:hover { border-color:var(--primary); }

.dashboard-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
.stat { background:var(--card); border:1px solid #8882; border-radius:18px; padding:10px 8px; text-align:center; }
.stat b { display:block; font-size:1.05rem; font-weight:500; }
.stat span { display:block; font-size:.68rem; color:var(--out); margin-top:2px; }
.patch-tools { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.patch-tools input { flex:1; min-width:0; }
@media (max-width:520px) {
  .dashboard-stats { gap:6px; }
  .stat { padding:9px 5px; }
  .patch-tools { align-items:stretch; flex-direction:column; }
  .patch-tools .pill { justify-content:center; }
}

/* Morphe Manager-inspired web layout */
.manager-home-head { padding: 22px 0 10px; position:relative; }
.manager-home-title { font-size:clamp(1.65rem,5vw,2.35rem); line-height:1.23; font-weight:700; letter-spacing:-.025em; text-align:center; padding:10px 34px 22px; }
.manager-search { height:66px; display:flex; align-items:center; gap:13px; border:2px solid var(--out); border-radius:20px; padding:0 18px; margin:0 0 16px; position:relative; background:color-mix(in srgb,var(--card) 78%,transparent); }
.manager-search:focus-within { border-color:var(--primary); }
.manager-search .ms { font-size:29px; color:var(--out); flex:none; }
.manager-search input { border:0!important; border-radius:0!important; padding:9px 0!important; background:transparent!important; color:var(--on)!important; font-size:1rem!important; box-shadow:none!important; min-width:0; flex:1; outline:none; }
.manager-search label { position:absolute; top:-11px; left:16px; background:var(--bg); padding:0 7px; color:var(--out); font-size:.88rem; }
.manager-home-list { display:flex; flex-direction:column; gap:13px; padding-bottom:8px; }
.manager-app-wrap { margin:0; overflow:hidden; border-radius:26px; }
.manager-home-card { min-height:114px; padding:15px 14px; border-radius:26px; border:1px solid #b0b7d477; background:linear-gradient(112deg,var(--app-a,#164e9a),var(--app-b,#0e7479)); display:flex; align-items:center; gap:14px; overflow:hidden; box-shadow:inset 0 1px 0 #ffffff20; cursor:pointer; }
.manager-home-card:active { filter:brightness(1.08); }
.manager-home-card .ico { width:78px; height:78px; border-radius:17px; background:transparent!important; box-shadow:none; }
.manager-home-card .ico img { padding:0; border-radius:16px; object-fit:contain; }
.manager-app-copy { min-width:0; flex:1; display:flex; flex-direction:column; gap:7px; }
.manager-app-name { font-size:clamp(1.12rem,4vw,1.5rem); font-weight:700; line-height:1.2; color:#fff; overflow-wrap:anywhere; text-shadow:0 1px 2px #0004; }
.manager-app-version { color:#e5e3ed; font-size:.88rem; line-height:1.35; overflow-wrap:anywhere; }
.manager-app-status { flex:none; max-width:42%; border-radius:24px; padding:9px 12px; background:#ffffff38; color:#fff; display:inline-flex; align-items:center; gap:5px; font-weight:600; font-size:.78rem; text-align:center; }
.manager-app-status .ms { font-size:17px; }
.manager-select-apps { width:100%; min-height:58px; margin:16px 0 18px; border:1px solid #686a78; border-radius:23px; background:#242530; color:var(--on); font:500 1rem Roboto,system-ui,sans-serif; }
.manager-select-apps:active { background:var(--card-high); }
#dock { left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:stretch; width:min(680px,calc(100% - 28px)); gap:7px; padding:7px; border-radius:28px; background:color-mix(in srgb,var(--card) 94%,transparent); box-shadow:0 5px 22px #0005; backdrop-filter:blur(12px); }
#dock .bb { width:100%; min-width:0; min-height:64px; padding:8px 4px; border:1px solid color-mix(in srgb,var(--out) 38%,transparent); border-radius:21px; font-size:.69rem; gap:3px; justify-content:center; }
#dock .bb .ms { font-size:25px; }
#dock .bb.hl { background:var(--pc); color:var(--primary); border-color:color-mix(in srgb,var(--primary) 55%,var(--out)); }
#main { padding-bottom:calc(164px + env(safe-area-inset-bottom)); max-width:760px; }
.manager-extra-menu { position:relative; flex:none; }
.manager-extra-menu .menu-pop { top:calc(100% + 5px); }
.manager-page-card { border:1px solid color-mix(in srgb,var(--primary) 30%,transparent); border-radius:22px; background:var(--card); padding:17px; margin:14px 0; }
.manager-flow-title { text-align:center; font-size:1.55rem; line-height:1.25; margin:22px 8px 14px; font-weight:700; }
.manager-flow-subtitle { text-align:center; color:var(--sec); font-size:1rem; line-height:1.5; margin:0 8px 24px; }
.manager-version-row { min-height:62px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #66687766; padding:12px 0; cursor:pointer; }
.manager-version-row:last-child { border-bottom:0; }
.manager-radio { width:25px; height:25px; accent-color:var(--primary); flex:none; }
.manager-version-name { flex:1; font-size:1.02rem; font-variant-numeric:tabular-nums; }
.manager-recommended { background:#70331f; color:#ffd4c5; border-radius:18px; padding:7px 10px; font-size:.72rem; font-weight:700; white-space:nowrap; }
.manager-full-action { width:100%; justify-content:center; min-height:58px; border-radius:20px; margin:7px 0; font-size:.94rem; padding:14px 16px; white-space:normal; }
.manager-full-action.primary { background:#6d221f; color:#fff; border:1px solid #ab4726; }
.manager-full-action.secondary { background:transparent; color:var(--on); border:1px solid color-mix(in srgb,var(--primary) 42%,var(--sv)); }
.manager-steps { border:1px solid #55586699; border-radius:22px; background:var(--card); padding:16px; margin:20px 0; }
.manager-step { display:flex; align-items:flex-start; gap:12px; padding:9px 0 16px; line-height:1.5; font-size:.91rem; }
.manager-step:last-child { padding-bottom:2px; }
.manager-step-num { width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; background:#70331f; color:#ffe0d2; font-weight:700; }
.manager-detail-hero { background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 32%,var(--card)),var(--card)); margin:0 -16px 16px; padding:25px 18px 20px; border-radius:0 0 24px 24px; }
.manager-detail-hero .ico { width:56px; height:56px; border-radius:15px; }
.manager-detail-title { font-size:1.45rem; font-weight:700; overflow-wrap:anywhere; }
.manager-detail-meta { color:var(--sec); font-size:.86rem; margin-top:4px; }
.manager-update-panel { border:1px solid color-mix(in srgb,var(--primary) 38%,transparent); border-radius:22px; background:var(--card); padding:15px; margin:12px 0 16px; text-align:center; }
.manager-update-panel .pill { width:100%; justify-content:center; min-height:51px; margin-top:8px; border-radius:17px; }
.manager-detail-row { display:flex; align-items:flex-start; gap:12px; padding:13px 0; border-bottom:1px solid #5b5e6b77; }
.manager-detail-row:last-child { border-bottom:0; }
.manager-detail-row > .ms { color:var(--out); font-size:21px; margin-top:3px; flex:none; }
.manager-detail-row .detail-label { color:var(--out); font-size:.75rem; margin-bottom:4px; }
.manager-detail-row .detail-value { color:var(--on); font-size:.92rem; overflow-wrap:anywhere; }
.manager-detail-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:14px 0; }
.manager-detail-actions .pill { width:100%; min-height:52px; justify-content:center; white-space:normal; }
.manager-patch-footer { position:sticky; bottom:calc(148px + env(safe-area-inset-bottom)); z-index:4; background:var(--bg); padding:12px 0 5px; }
@media (min-width:900px) {
 #dock { display:flex; width:82px; left:14px; top:50%; bottom:auto; transform:translateY(-50%); flex-direction:column; border-radius:28px; }
 #dock .bb { width:100%; min-height:70px; }
 #main { margin-left:max(104px,calc(50vw - 380px + 52px)); }
 .manager-home-card { min-height:120px; }
}
@media (max-width:420px) {
 .manager-home-title { padding-left:22px; padding-right:22px; font-size:1.7rem; }
 .manager-home-card { gap:11px; padding:12px; min-height:101px; }
 .manager-home-card .ico { width:62px; height:62px; }
 .manager-app-status { max-width:40%; font-size:.69rem; padding:8px; }
 .manager-app-name { font-size:1.07rem; }
 .manager-app-version { font-size:.88rem; }
 .manager-detail-actions { gap:7px; }
}

#dock .bb span { display:none; }
#dock .bb.hl span { display:block; }
.manager-home-card .ico { background:transparent; }
@media (min-width:900px) { #dock .bb span { display:block; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="main"></div>

<button class="pill fab" id="fab" data-a="save" style="display:none">
  <i class="ms">save</i> Save changes
</button>

<div id="dock" aria-label="Home actions">
  <button class="bb" data-a="home_sources" aria-label="Patch sources" title="Patch sources"><i class="ms">folder_open</i><span>Sources</span></button>
  <button class="bb" data-a="home_search" aria-label="Search apps" title="Search apps"><i class="ms">search</i><span>Search</span></button>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const b64 = s => {
  try {
    const bin = atob(s.replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  } catch(e) { return '{}'; }
};
const u64 = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
};

const LS = 'patch-manager-cfg';
function getAppMeta(pkg) {
  const parts = String(pkg || '').split('.');
  const raw = parts[parts.length - 1] || pkg || 'app';
  const name = raw.replace(/[-_]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
  let hash = 0;
  for (const ch of String(pkg || 'app')) hash = (hash * 31 + ch.charCodeAt(0)) | 0;
  const hue1 = Math.abs(hash) % 360;
  const hue2 = (hue1 + 150 + (Math.abs(hash >> 7) % 60)) % 360;
  return { name: name || 'App', color: 'hsl(' + hue1 + ' 76% 35%),hsl(' + hue2 + ' 72% 31%)' };
}

function officialIconUrl(a) {
  // Icons are sourced from the generated catalog when available. Keep the UI
  // generic rather than maintaining a package-specific icon/domain registry.
  return '';
}

function appIconUrl(a) {
  const info = (a && S.cats[a.id] && S.cats[a.id].info) || {};
  return info.icon_url || (a && a.icon_url) || (a && a.id ? 'catalog/icons/' + encodeURIComponent(a.id) + '.png' : '') || officialIconUrl(a);
}
function appIconHtml(a) {
  const label = esc((ttl(a)[0] || 'A').toUpperCase());
  const url = appIconUrl(a);
  const bg = 'background:linear-gradient(135deg, ' + hue(a) + ')';
  if (!url) return '<div class="ico" style="' + bg + '">' + label + '</div>';
  return '<div class="ico" style="' + bg + '"><img src="' + esc(url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\';"><span style="display:none;width:100%;height:100%;place-items:center">' + label + '</span></div>';
}

const ARCH = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'];
const EXT = /\.(apk|apkm|apks|xapk|axapk)$/i;
let deferredInstallPrompt = null;

let S = {
  owner: '', repo: '', branch: 'main', token: '', wf: 'build.yml',
  mode: 'system', black: false, accent: '#E34A70', scale: 100,
  config: { 
    settings: { 
      default_arch: 'arm64-v8a', 
      auto_prune: true, 
      keep_releases: 3, 
      trigger_policy: 'on_new_patch', 
      check_interval_hours: 6,
      notify_patch_source_failure: true, notify_patching_failure: true, notify_output_validation_failure: true, notify_release_publishing_failure: true
    }, 
    sources: [], apps: [], hidden_apps: [] 
  },
  cats: {}, rels: [], runs: [], upstreamTags: {}, dirty: false,
  onlySel: false, live: null, connected: false, localApks: {}, sourceSearch: '', patchSearch: {}, homeSearch: '', homeSort: 'manual'
};

if (/github\.io$/.test(location.hostname)) {
  S.owner = location.hostname.split('.')[0];
  S.repo = location.pathname.split('/')[1] || '';
}
try {
  const cached = JSON.parse(localStorage.getItem(LS) || localStorage.getItem('patchmanager') || '{}');
  if (cached.accent === '#A4C9FF') cached.accent = '#E34A70';
  Object.assign(S, cached);
} catch(e){}

const persist = () => {
  const { owner, repo, branch, token, wf, mode, black, accent, scale, homeSort, homeSearch } = S;
  localStorage.setItem(LS, JSON.stringify({ owner, repo, branch, token, wf, mode, black, accent, scale, homeSort, homeSearch }));
};
const sw = (on, attrs) => `<div class="sw ${on?'on':''}" ${attrs}></div>`;
const A = {}, C = {};

function toast(t, bad) {
  const e = $('#toast');
  e.textContent = t;
  e.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(e.t);
  e.t = setTimeout(() => e.className = 'toast', 3200);
}

async function gh(path, o={}, raw) {
  const r = await fetch(raw ? path : 'https://api.github.com/repos/' + S.owner + '/' + S.repo + path, {
    ...o,
    headers: {
      Authorization: 'Bearer ' + S.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(o.body ? {'Content-Type': 'application/json'} : {}),
      ...(o.headers || {})
    }
  });
  if (!r.ok) {
    let m = '';
    try { m = (await r.json()).message; } catch(e){}
    const er = new Error('GitHub ' + r.status + (m ? ': ' + m : ''));
    er.status = r.status;
    throw er;
  }
  return r.status == 204 ? null : r.json();
}

function apkReadiness(a, info) {
  info = info || {};
  const acquisition = info.apk_acquisition || {};
  const stock = info.stock_apk || null;
  const target = a.version || acquisition.target_version || info.recommended_version || '';
  const stockExact = !!(stock && stock.version_name && target && stock.version_name === target);
  const stockRelease = stockRel(a.id);
  const hasStockAsset = !!(stockRelease && (stockRelease.assets || []).some(x => EXT.test(x.name)));
  if (acquisition.status === 'manual_required') return {state:'manual', label:'Manual APK required', detail: target ? 'Exact ' + target + ' was not acquired automatically.' : 'Automatic APK acquisition failed.', target:target};
  if (stockExact) return {state:'ready', label:'Exact APK verified', detail: target + ' · ' + ((stock.architectures || []).join(', ') || 'architecture recorded'), target:target};
  if (hasStockAsset && !stock) return {state:'unknown', label:'Stock APK present', detail:'Release contains an APK, but its metadata has not been recorded yet.', target:target};
  if (acquisition.status === 'downloaded' && stock) return {state:'warning', label:'APK metadata needs refresh', detail:'Recorded ' + (stock.version_name || 'unknown') + ' · target ' + (target || 'Auto'), target:target};
  return {state:'unknown', label:'APK not checked', detail: target ? 'Target version: ' + target : 'No target version selected.', target:target};
}


function targetVersionFor(a, info) {
  info = info || {};
  const acq = info.apk_acquisition || {};
  return a.version || acq.target_version || info.recommended_version || 'Auto';
}

function latestPatchedAsset(a) {
  const rel = relsFor(a.id)[0];
  if (!rel) return null;
  const asset = (rel.assets || []).find(x => /\.apk$/i.test(x.name));
  return asset ? { ...asset, release: rel } : null;
}

function patchedAppVersion(asset) {
  if (!asset) return '';
  const body = asset.release && asset.release.body || '';
  const fromNotes = body.match(/^\s*-\s*\*\*App Version:\*\*\s*([^\r\n]+)/im);
  if (fromNotes && !/^(auto|latest)$/i.test(fromNotes[1].trim())) return fromNotes[1].trim();
  const fromName = String(asset.name || '').match(/_app-(.+)\.apk$/i);
  return fromName ? fromName[1] : '';
}

function compareVersionNumbers(left, right) {
  const a = String(left || '').match(/\d+/g);
  const b = String(right || '').match(/\d+/g);
  if (!a || !b) return null;
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const av = Number(a[i] || 0), bv = Number(b[i] || 0);
    if (av !== bv) return av > bv ? 1 : -1;
  }
  return 0;
}

function updateAvailability(a, info, asset) {
  info = info || {};
  const sourceRepo = info.patch_source || (Array.isArray(a.patch_sources) && a.patch_sources[0]) || a.patches_repo || '';
  const sourceTag = sourceRepo && S.upstreamTags[sourceRepo] || '';
  const patchUpdate = !!(asset && info.patch_tag && sourceTag && sourceTag !== info.patch_tag);
  const builtVersion = patchedAppVersion(asset) || a.version || '';
  const supportedVersion = info.recommended_version || '';
  const versionOrder = compareVersionNumbers(supportedVersion, builtVersion);
  const appVersionUpdate = !!(asset && supportedVersion && builtVersion && versionOrder > 0);
  return { patchUpdate, appVersionUpdate, hasUpdate: patchUpdate || appVersionUpdate };
}

function renderBuildTimeline(stage, status) {
  const order = [
    ['patch_source', 'Patch source'],
    ['apk_acquisition', 'Stock APK'],
    ['patching', 'Applying patches'],
    ['output_validation', 'Verify patched APK'],
    ['publishing', 'Publishing'],
    ['completed', 'Completed']
  ];
  const idx = Math.max(0, order.findIndex(x => x[0] === stage));
  return '<div class="step-list">' + order.map((x, i) => {
    const done = status === 'success' ? i < order.length - 1 : (status === 'running' && i < idx);
    const current = status === 'running' && i === idx;
    return '<div class="step '+(done?'done ':'')+(current?'current':'')+'"><span class="step-dot"></span><span>'+(done?'✓ ':'')+esc(x[1])+'</span></div>';
  }).join('') + '</div>';
}

function renderAppStatus(a, info) {
  const readiness = apkReadiness(a, info);
  const st = (info && info.build_status) || {};
  const asset = latestPatchedAsset(a);
  const version = targetVersionFor(a, info);
  const tone = readiness.state === 'ready' ? 'ok' : readiness.state === 'manual' ? 'bad' : 'warn';
  const icon = readiness.state === 'ready' ? 'verified' : readiness.state === 'manual' ? 'error' : 'help';
  const label = readiness.state === 'ready' ? 'APK ready' : readiness.state === 'manual' ? 'APK required' : 'APK needs checking';
  const detail = readiness.state === 'ready'
    ? version + ' · ' + ((info.stock_apk && info.stock_apk.architectures || []).join(', ') || 'architecture verified')
    : readiness.detail;

  let action = '';
  if (asset) {
    action = '<div class="action-row"><a class="pill" style="text-decoration:none" href="'+esc(asset.browser_download_url)+'" download><i class="ms">download</i> Download Patched APK</a><a class="pill o" style="text-decoration:none" href="'+esc(asset.release.html_url)+'" target="_blank" rel="noopener">View Release ↗</a></div>';
  } else if (readiness.state === 'manual') {
    action = '<div class="action-row"><button class="pill" data-a="dlg_need_apk" data-id="'+esc(a.id)+'"><i class="ms">download</i> Get Exact APK</button><button class="pill o" data-a="dlg_upload_apk" data-id="'+esc(a.id)+'"><i class="ms">upload</i> Upload APK</button></div>';
  } else if (readiness.state === 'ready') {
    action = '<div class="action-row"><button class="pill" data-a="dispatch_app" data-id="'+esc(a.id)+'"><i class="ms">bolt</i> Start Patch</button></div>';
  } else {
    action = '<div class="action-row"><button class="pill" data-a="start_flow" data-id="'+esc(a.id)+'"><i class="ms">play_arrow</i> Prepare APK</button></div>';
  }

  const build = st.status ? '<div style="margin-top:12px"><div class="d">Last build</div><div style="margin-top:4px"><span class="chip '+(st.status==='success'?'ok':st.status==='failed'?'bad':'warn')+'">'+esc(st.status==='success'?'Completed':st.status==='failed'?'Failed':'Running')+'</span> '+esc(st.stage || '')+'</div></div>' : '';

  return '<details class="status-card build-collapsible"><summary><span class="status-title"><span class="status-icon '+tone+'"><i class="ms" style="font-size:18px">'+icon+'</i></span><span style="flex:1"><b>'+esc(label)+'</b><span class="d" style="display:block;margin-top:3px">'+esc(detail)+'</span></span><i class="ms expand-icon">expand_more</i></span></summary><div class="collapsible-content">'+build+action+'</div></details>';
}
function buildStatusView(a, info) {
  const st = (info && info.build_status) || {};
  if (!st.status) return '';
  const failed = st.status === 'failed';
  const success = st.status === 'success';
  const labels = {
    patch_source: 'Patch source',
    apk_acquisition: 'Stock APK',
    patching: 'Morphe patching',
    output_validation: 'Output validation',
    publishing: 'Publishing',
    completed: 'Completed'
  };
  const label = labels[st.stage] || st.stage || 'Build';
  const detail = st.reason || (success ? ('Release ' + (st.release_tag || '') + ' published successfully.') : (st.status === 'running' ? 'Build is in progress.' : 'Build state recorded.'));
  const cls = success ? 'ok' : failed ? 'bad' : 'warn';
  const icon = success ? 'verified' : failed ? 'error' : 'sync';
  return `
    <div class="card" style="background:var(--card-high);margin:10px 0 4px">
      <div class="row">
        <div class="g">
          <b>Last Build State</b>
          <div style="margin-top:5px"><span class="chip ${cls}"><i class="ms" style="font-size:15px">${icon}</i> ${esc(failed ? 'Failed at ' + label : success ? 'Completed' : 'Running: ' + label)}</span></div>
          <div class="d" style="margin-top:5px">${esc(detail)}</div>
        </div>
        ${failed && st.stage === 'apk_acquisition' ? '<button class="pill" data-a="dlg_need_apk" data-id="' + esc(a.id) + '">Recover APK</button>' : ''}
        ${failed && st.stage === 'publishing' ? '<button class="pill" data-a="dispatch_app" data-id="' + esc(a.id) + '">Retry Publish</button>' : ''}
      </div>
    </div>`;
}
const app = id => (S.config.apps || []).find(a => a.id === id);
const ttl = a => a.name || getAppMeta(a.package).name || a.id;
const dirty = () => { S.dirty = true; $('#fab').style.display = 'block'; };
const hue = a => getAppMeta(a.package).color;
const eff = (a, p) => (a.enable || []).includes(p.name) ? true : (a.disable || []).includes(p.name) ? false : !!p.enabled;
const ago = d => {
  const s = (Date.now() - Date.parse(d)) / 1e3;
  return s < 90 ? 'just now' : s < 5400 ? Math.round(s/60) + 'm ago' : s < 129600 ? Math.round(s/3600) + 'h ago' : Math.round(s/86400) + 'd ago';
};
function relsFor(id) { return S.rels.filter(r => !r.draft && r.tag_name.startsWith(id + '-')); }
const stockRel = id => S.rels.find(r => r.tag_name === 'stock-' + id);
const stockFiles = id => ((stockRel(id) || {}).assets || []).filter(x => EXT.test(x.name));
function hasStockApk(id) { return stockFiles(id).length > 0 || (S.localApks[id] && S.localApks[id].length > 0); }

/* --- Data Loading & Repository Sync --- */
async function connect(quiet) {
  if (!S.owner || !S.repo || !S.token) return dlgConnect();
  try {
    try {
      const d = await gh('/contents/config.json?ref=' + encodeURIComponent(S.branch));
      S.sha = d.sha;
      S.config = JSON.parse(b64(d.content));
    } catch(e) {
      if (e.status != 404) throw e;
      S.sha = '';
      S.config = { 
        settings: { default_arch: 'arm64-v8a', auto_prune: true, keep_releases: 3, trigger_policy: 'on_new_patch', check_interval_hours: 6, notify_patch_source_failure: true, notify_patching_failure: true, notify_output_validation_failure: true, notify_release_publishing_failure: true }, 
        sources: [], apps: [], hidden_apps: [] 
      };
    }
    if (!S.config.settings) S.config.settings = { default_arch: 'arm64-v8a', auto_prune: true, keep_releases: 3, trigger_policy: 'on_new_patch', check_interval_hours: 6, notify_patch_source_failure: true, notify_patching_failure: true, notify_output_validation_failure: true, notify_release_publishing_failure: true };
    const hadLegacyWebhook = Object.prototype.hasOwnProperty.call(S.config.settings, 'discord_webhook');
    delete S.config.settings.discord_webhook;
    if (!Array.isArray(S.config.apps)) S.config.apps = [];
    if (!Array.isArray(S.config.sources)) S.config.sources = [];
    if (!Array.isArray(S.config.hidden_apps)) S.config.hidden_apps = [];

    S.connected = true; S.dirty = hadLegacyWebhook; persist(); closeDlg(); render();
    await Promise.all([loadLocalCatalogs(), loadRels(), loadRuns(), checkLocalApks(), checkUpstreamUpdates()]);
    render();
    // Discord recovery links use #/upload/<app-id>. After the repository data
    // is loaded and the user is connected, open the app's existing upload form.
    const currentRoute = route();
    if (currentRoute.v === 'upload' && app(currentRoute.id)) {
      openUploadApkDialog(currentRoute.id);
    }
    if (!quiet) toast('Connected ✔');
  } catch(e) {
    S.connected = false;
    toast(e.message, 1);
    if (!quiet) dlgConnect();
    render();
  }
}

async function checkLocalApks() {
  try {
    const files = await gh('/contents/apks?ref=' + encodeURIComponent(S.branch));
    S.localApks = {};
    if (Array.isArray(files)) {
      files.forEach(f => {
        (S.config.apps || []).forEach(a => {
          if (f.name.startsWith(a.id) || f.name.startsWith(a.package)) {
            S.localApks[a.id] = S.localApks[a.id] || [];
            S.localApks[a.id].push(f.name);
          }
        });
      });
    }
  } catch(e) { S.localApks = {}; }
}

async function loadLocalCatalogs() {
  for (const a of (S.config.apps || [])) {
    try {
      let patches = null, info = null;
      try {
        const pRes = await fetch('catalog/' + encodeURIComponent(a.id) + '.json?t=' + Date.now());
        if (pRes.ok) patches = await pRes.json();
        const iRes = await fetch('catalog/' + encodeURIComponent(a.id) + '.info.json?t=' + Date.now());
        if (iRes.ok) info = await iRes.json();
      } catch(e){}

      if (!patches && S.token) {
        try {
          const d = await gh('/contents/docs/catalog/' + encodeURIComponent(a.id) + '.json?ref=' + encodeURIComponent(S.branch));
          patches = JSON.parse(b64(d.content));
          try {
            const idoc = await gh('/contents/docs/catalog/' + encodeURIComponent(a.id) + '.info.json?ref=' + encodeURIComponent(S.branch));
            info = JSON.parse(b64(idoc.content));
          } catch(e){}
        } catch(e){}
      }

      if (patches) {
        S.cats[a.id] = { patches, info };
      }
    } catch(e) {
      console.warn('Catalog load error for', a.id, e);
    }
  }
}

async function checkUpstreamUpdates() {
  for (const a of (S.config.apps || [])) {
    const repos = Array.isArray(a.patch_sources) && a.patch_sources.length
      ? a.patch_sources
      : (a.patches_repo ? [a.patches_repo] : []);
    for (const repo of repos) {
      try {
        const rels = await gh(`https://api.github.com/repos/${repo}/releases?per_page=1`, {}, 1);
        if (Array.isArray(rels) && rels.length > 0) {
          S.upstreamTags[repo] = rels[0].tag_name || rels[0].tagName;
        }
      } catch(e){}
    }
  }
}

async function loadRels() { try { S.rels = await gh('/releases?per_page=100'); } catch(e){ S.rels = []; } }
async function loadRuns() { try { S.runs = (await gh('/actions/runs?per_page=15')).workflow_runs; } catch(e){ S.runs = []; } }

async function save() {
  try {
    const r = await gh('/contents/config.json', {
      method: 'PUT',
      body: JSON.stringify({
        message: 'Update config from Patch Manager Web UI',
        branch: S.branch,
        content: u64(JSON.stringify((() => { const config = JSON.parse(JSON.stringify(S.config)); if (config.settings) delete config.settings.discord_webhook; return config; })(), null, 2) + '\n'),
        ...(S.sha ? { sha: S.sha } : {})
      })
    });
    S.sha = r.content.sha;
    if (S.config.settings) delete S.config.settings.discord_webhook;
    S.dirty = false;
    render();
    toast('Saved ✔ Build triggered automatically');
  } catch(e) {
    toast(e.status == 409 || e.status == 422 ? 'Conflict on server. Reconnect to refresh' : e.message, 1);
  }
}

let suppressCardClickUntil = 0;
let touchState = { startX:0, startY:0, el:null, id:null, swiping:false };

function initGestures() {
  document.querySelectorAll('.swipe-front').forEach(card => {
    card.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchState = { startX: t.clientX, startY: t.clientY, el: card, id: card.dataset.id, swiping: false };
    }, { passive: true });

    card.addEventListener('touchmove', e => {
      if (!touchState.el) return;
      const t = e.touches[0];
      const diffX = t.clientX - touchState.startX;
      const diffY = t.clientY - touchState.startY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 12) {
        touchState.swiping = true;
        touchState.el.style.transform = `translateX(${diffX}px)`;
        const bg = touchState.el.previousElementSibling;
        if (diffX > 0) {
          bg.className = 'swipe-bg right';
          bg.innerHTML = '<span class="row"><i class="ms">tune</i> View Patches</span>';
        } else {
          bg.className = 'swipe-bg left';
          bg.innerHTML = '<span class="row">Hide App <i class="ms">visibility_off</i></span>';
        }
      }
    }, { passive: true });

    card.addEventListener('touchend', e => {
      if (!touchState.swiping || !touchState.el) return;
      const t = e.changedTouches[0];
      const diffX = t.clientX - touchState.startX;
      touchState.el.style.transform = '';
      if (Math.abs(diffX) > 85) suppressCardClickUntil = Date.now() + 700;

      if (diffX > 85) {
        location.hash = '#/patcher/' + encodeURIComponent(touchState.id);
      } else if (diffX < -85) {
        hideApp(touchState.id);
      }
      touchState.swiping = false;
    });
  });
}

function hideApp(id) {
  S.config.hidden_apps = S.config.hidden_apps || [];
  if (!S.config.hidden_apps.includes(id)) {
    S.config.hidden_apps.push(id);
    dirty(); render();
    toast(`Hidden ${id}. Restore in Settings → Apps.`);
  }
}

const dlg = h => { $('#dlg').innerHTML = h; $('#dbg').classList.add('on'); };
const closeDlg = () => $('#dbg').classList.remove('on');

function startPatchFlow(id) {
  const a = app(id);
  if (!a) return toast('App not found', 1);
  const cat = S.cats[id];
  const info = cat && cat.info ? cat.info : {};
  const readiness = apkReadiness(a, info);
  const version = targetVersionFor(a, info);
  const asset = latestPatchedAsset(a);

  if (asset) {
    dlg(`
      <h2>Patch Ready</h2>
      <p><b>${esc(ttl(a))}</b> · target <b>${esc(version)}</b></p>
      <div class="status-card">
        <div class="status-title">
          <span class="status-icon ok"><i class="ms">verified</i></span>
          <div><b>Patched APK available</b><div class="d" style="margin-top:3px">Morphe ${esc((info.patch_tag || asset.release.tag_name || '').replace(/^v/, 'v'))}</div></div>
        </div>
      </div>

async function uploadReleaseAsset(release, file, onProgress) {
  const base = String(release.upload_url || '').replace(/\{\?name,label\}$/, '');
  if (!base) throw new Error('GitHub release upload URL is unavailable.');
  return await new Promise((resolve,reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', base + '?name=' + encodeURIComponent(file.name), true);
    xhr.setRequestHeader('Authorization','Bearer ' + S.token);
    xhr.setRequestHeader('Accept','application/vnd.github+json');
    xhr.setRequestHeader('X-GitHub-Api-Version','2022-11-28');
    xhr.setRequestHeader('Content-Type', /\.apk$/i.test(file.name) ? 'application/vnd.android.package-archive' : 'application/octet-stream');
    xhr.upload.onprogress = e => { if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(new Error('Invalid GitHub upload response.')); }
      } else {
        let m=''; try { m=JSON.parse(xhr.responseText).message || ''; } catch(e){}
        reject(new Error('Upload failed (' + xhr.status + ')' + (m ? ': ' + m : '')));
      }
    };
    xhr.onerror = () => reject(new Error('Network error during APK upload.'));
    xhr.send(file);
  });
}

function appByPackage(pkg) {

function normalizeAndroidPackage(value) {
  return String(value || '').trim().replace(/^["']|["']$/g, '');

function extractPlayPackage(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  try {
    const u = new URL(raw);
    if (/(.|^)play\.google\.com$/i.test(u.hostname)) {
      return normalizeAndroidPackage(u.searchParams.get('id') || '');
    }
  } catch(e) {}
  return /^[a-z][a-z0-9_]*(\.[a-z0-9_]+)+$/i.test(raw) ? raw : '';
}

function normalizeLookupText(value) {
  return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function matchConfiguredPatchApps(name, androidPackage) {
  const wantedName = normalizeLookupText(name);
  const wantedPkg = normalizeLookupText(androidPackage);
  const pkgLeaf = wantedPkg.split('.').pop();
  const hits = [];

  for (const src of (S.config.sources || [])) {
    if (src.enabled === false) continue;

    for (const item of (src.apps || [])) {
      const patchPackage = typeof item === 'string' ? item : (item.package || '');
      const appName = typeof item === 'string'
        ? getAppMeta(patchPackage).name
        : (item.name || getAppMeta(patchPackage).name);

      const pn = normalizeLookupText(patchPackage);
      const an = normalizeLookupText(appName);
      let score = 0;

      if (wantedName && an === wantedName) score += 100;
      else if (wantedName && (an.includes(wantedName) || wantedName.includes(an))) score += 50;

      if (wantedPkg && pn === wantedPkg) score += 120;
      if (pkgLeaf && (pn === pkgLeaf || an === pkgLeaf)) score += 25;

      if (score > 0) {
        hits.push({ repo: src.repo, package: patchPackage, name: appName, source: src, score });
      }
    }
  }

  hits.sort((a,b) => b.score - a.score);
  const unique = new Map();
  hits.forEach(x => {
    const key = x.repo + '|' + x.package;
    if (!unique.has(key)) unique.set(key, x);
  });
  return Array.from(unique.values());
}

function appIdFromName(name, pkg) {
  const seed = String(name || pkg || 'app').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const base = seed || 'app';
  let id = base, n = 2;
  while ((S.config.apps || []).some(a => a.id === id)) id = base + '-' + n++;
  return id;
}

function sourceAppId(pkg) {
  const parts = String(pkg || '').split('.').filter(Boolean);
  let base = (parts[parts.length - 1] || 'app').toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
  if (!base) base = 'app';
  let id = base, n = 2;
  while ((S.config.apps || []).some(a => a.id === id && a.package !== pkg)) id = base + '-' + n++;
  return id;
}

function addDiscoveredApp(pkg, repo) {
  const repos = Array.isArray(repo) ? repo : [repo];
  const sources = repos.map(configuredSourceForRepo).filter(Boolean);
  if (!sources.length) return toast('Source is not configured. Inspect and add it first.', 1);
  S.config.apps = Array.isArray(S.config.apps) ? S.config.apps : [];
  let a = appByPackage(pkg);

  if (!a) {
    const id = sourceAppId(pkg);
    const defArch = (S.config.settings && S.config.settings.default_arch) || 'arm64-v8a';
    a = {
      id, package: pkg, patches_repo: sources[0].repo,
      patch_sources: sources.map(x => x.repo),
      prerelease: sources.some(x => x.prerelease === true),
      arch: defArch, apk_arch: 'auto',
      version: '', force: false, auto_patch: true, enable: [], disable: [], options: {}
    };
    S.config.apps.push(a);
  } else {
    a.patch_sources = Array.isArray(a.patch_sources) ? a.patch_sources : (a.patches_repo ? [a.patches_repo] : []);
    for (const x of sources) if (!a.patch_sources.includes(x.repo)) a.patch_sources.push(x.repo);
    if (!a.patches_repo) a.patches_repo = sources[0].repo;
  }

  dirty();
  render();
  toast('App added to Apps with compatible patch sources. Save changes.');
}

function dashboardSummary() {
  const apps = (S.config.apps || []).filter(a => !(S.config.hidden_apps || []).includes(a.id));
  let ready = 0, attention = 0, updates = 0;
  apps.forEach(a => {
    const info = (S.cats[a.id] && S.cats[a.id].info) || {};
    const st = apkReadiness(a, info);
    if (st.state === 'ready') ready++; else attention++;
    const rel = relsFor(a.id)[0];
    const patchTag = rel ? rel.tag_name.replace(a.id + '-', '') : '';
    const sourceTag = S.upstreamTags[a.patches_repo] || info.patch_tag || '';
    if (patchTag && sourceTag && patchTag !== sourceTag) updates++;
  });
  return { total: apps.length, ready, attention, updates };
}

    <details class="card">

function renderPatchesList(a, patches) {
  if (!patches || !patches.length) return '<div class="card">No patch list loaded for this app.</div>';
  const q = String((S.patchSearch && S.patchSearch[a.id]) || '').trim().toLowerCase();
  const visible = patches.filter(p => {
    if (S.onlySel && !eff(a, p)) return false;
    if (!q) return true;
    return (String(p.name || '') + ' ' + String(p.description || '')).toLowerCase().includes(q);
  });
  if (!visible.length) return '<div class="card d">No patches match the current search/filter.</div>';
  return visible.map(p => {
    const on = eff(a, p);
    const hasOpts = p.options && p.options.length;
    const isCustom = a.options && a.options[p.name] && Object.keys(a.options[p.name]).length;

    return `
      <div class="card" style="padding:10px 14px;margin-bottom:8px">
        <div class="row">
          <div class="g">
            <b>${esc(p.name)}</b>
            ${p.enabled ? '' : '<span class="chip">Off by default</span>'}
            ${isCustom ? '<span class="chip p">Customized</span>' : ''}
            <div class="d">${esc(p.description || '')}</div>
          </div>
          ${hasOpts ? `
            <button class="ib" title="Patch Options" data-a="open_opts" data-id="${esc(a.id)}" data-p="${esc(p.name)}">
              <i class="ms" style="color:var(--primary)">settings</i>
            </button>
          ` : ''}
          ${sw(on, `data-a="pt" data-id="${esc(a.id)}" data-n="${esc(p.name)}"`)}
        </div>
      </div>
    `;
  }).join('');
}

/* Sources View */
function vSources() {
  const sources = Array.isArray(S.config.sources) ? S.config.sources : [];
  const q = (S.sourceSearch || '').trim().toLowerCase();
  const filteredSources = sources.filter(src => {
    if (!q) return true;
    const hay = [src.repo, src.tag, src.release_name, ...(src.apps || []).map(a => typeof a === 'string' ? a : (a.name || a.package || ''))].join(' ').toLowerCase();
    return hay.includes(q);
  });

  const apps = new Map();
  for (const src of sources) {
    if (src.enabled === false) continue;
    for (const item of (src.apps || [])) {
      const pkg = typeof item === 'string' ? item : item.package;
      if (!pkg) continue;
      const name = typeof item === 'string' ? getAppMeta(pkg).name : (item.name || getAppMeta(pkg).name);
      if (!apps.has(pkg)) apps.set(pkg, { package: pkg, name, sources: [] });
      apps.get(pkg).sources.push(src.repo);
    }
  }

  const appList = Array.from(apps.values())
    .filter(x => !q || (x.name + ' ' + x.package + ' ' + x.sources.join(' ')).toLowerCase().includes(q))
    .sort((a,b) => a.name.localeCompare(b.name));

  return hdr('Patch Sources', 'Repository & App Compatibility') + `
    <div class="banner">
      <i class="ms" style="font-size:32px">hub</i>
      <div style="flex:1">
        <div style="font-weight:500">${sources.length} configured source(s)</div>
        <div class="s">Browse compatible apps across all sources. Add an app without retyping its package or repository.</div>
      </div>
      <button class="pill" data-a="addpatchsource"><i class="ms">add</i> Add Source</button>
    </div>

    <input type="search" data-c="source_search" value="${esc(S.sourceSearch || '')}" placeholder="Search source, app or package…">

    <div class="sec-h">Configured Sources</div>
    ${filteredSources.length ? filteredSources.map(src => `
      <div class="card">
        <div class="row">
          <div class="ico" style="width:42px;height:42px;font-size:15px;flex:none">${esc((src.repo || 'S')[0].toUpperCase())}</div>
          <div class="g">
            <b>${esc(src.repo || 'Unknown source')}</b>
            <div class="d">Release ${esc(src.tag || 'unknown')} · ${src.patch_count || '?'} patches · ${(src.apps || []).length} app(s)</div>
          </div>
          <button class="pill t" data-a="source_toggle" data-repo="${esc(src.repo)}">${src.enabled === false ? 'Enable' : 'Disable'}</button>
        </div>
      </div>
    `).join('') : '<div class="card d">No configured sources match your search.</div>'}

    <div class="sec-h">Discover Apps</div>
    ${appList.length ? appList.map(x => {
      const existing = appByPackage(x.package);
      const repos = x.sources;
      return `
        <div class="card">
          <div class="row">
            <div class="ico" style="width:42px;height:42px;font-size:15px;flex:none;background:linear-gradient(135deg, ${hue({package:x.package})})">${esc(x.name[0]?.toUpperCase() || '?')}</div>
            <div class="g">
              <b>${esc(x.name)}</b>
              <div class="mono">${esc(x.package)}</div>
              <div class="d">Source: ${x.sources.map(esc).join(' · ')}</div>
            </div>
            ${existing
              ? '<span class="chip ok">Added</span>'
              : `<button class="pill" data-a="source_app_add" data-repo="${esc(JSON.stringify(repos))}" data-pkg="${esc(x.package)}">Add</button>`}
          </div>
        </div>
      `;
    }).join('') : '<div class="card d">No compatible apps available yet. Add and inspect a patch source first.</div>'}

    <div class="d" style="margin:12px 4px">A source can provide many apps. Adding one here creates the app configuration and makes this repository its first patch-source candidate; adding another source later adds it to the priority list.</div>
  `;
}

/* Patched Apps View */
function vPatchedApps() {
  const rows = [];
  (S.config.apps || []).forEach(a => {
    relsFor(a.id).forEach(rel => {
      (rel.assets || []).filter(x => /\.apk$/i.test(x.name)).forEach(asset => rows.push({ a, rel, asset }));
    });
  });
  rows.sort((x,y) => Date.parse(y.rel.published_at || y.rel.created_at || 0) - Date.parse(x.rel.published_at || x.rel.created_at || 0));

  if (!rows.length) {
    return hdr('Patched Apps', 'No patched APKs published yet', 1) + `

        <div class="d" style="margin:6px 0">Patched APKs will appear here after a successful build publishes a release.</div>

  }

  return hdr('Patched Apps', rows.length + ' APK file(s) available', 1) + `
    <div class="card">
      <div class="d">All published patched APKs are listed here, regardless of whether the stock APK was acquired automatically or supplied manually.</div>
    </div>
    ${rows.map(x => `
      <div class="card">

function vApp(r) {
  const a = app(r.id);
  if (!a) return hdr('App', 'App not found', 1) + '<div class="card">This app is no longer in the active list. Restore it from Settings or go back.</div>';
  const cat = S.cats[a.id];
  const info = (cat && cat.info) || {};
  const patches = cat && cat.patches ? cat.patches : [];
  const selectedCount = patches.filter(p => eff(a,p)).length;
  const asset = latestPatchedAsset(a);
  const latestRel = asset ? asset.release : null;
  const updates = updateAvailability(a, info, asset);
  const patchUpdate = updates.patchUpdate;
  const appVersionUpdate = updates.appVersionUpdate;
  const hasUpdate = updates.hasUpdate;
  const version = asset && latestRel ? (patchedAppVersion(asset) || targetVersionFor(a, info)) : targetVersionFor(a, info);
  const compatibleRaw = Array.isArray(info.compatible_versions) ? info.compatible_versions : (Array.isArray(info.supported_versions) ? info.supported_versions : []);
  const versions = compatibleRaw.map(v => typeof v === 'object' && v ? String(v.version || v.version_name || v.name || '') : String(v || '')).filter(Boolean);
  const recommended = String(info.recommended_version || versions[0] || a.version || '');
  const selected = String(a.version || recommended || targetVersionFor(a,info) || '');
  const readiness = apkReadiness(a, info);
  if (!asset && readiness.state === 'ready') {
    const sourceFailed = info.build_status && info.build_status.status === 'failed' && info.build_status.stage === 'patch_source';
    const configuredRepos = Array.isArray(a.patch_sources) && a.patch_sources.length ? a.patch_sources : (a.patches_repo ? [a.patches_repo] : []);
    const hasConfiguredSource = configuredRepos.some(repo => configuredSourceForRepo(repo));
    const verifiedVersion = readiness.target || targetVersionFor(a, info);
    const verifiedArch = info.stock_apk && Array.isArray(info.stock_apk.architectures) && info.stock_apk.architectures.length
      ? info.stock_apk.architectures.join(' · ')
      : (a.apk_arch || a.arch || 'Architecture recorded');
    const sourceLabel = hasConfiguredSource ? configuredRepos.filter(repo => configuredSourceForRepo(repo)).join(' · ') : 'No compatible source configured';
    return hdr(ttl(a), 'v' + verifiedVersion, 1) +
      '<div class="manager-detail-hero"><div class="app-hero">' + appIconHtml(a) + '<div class="hero-copy"><div class="manager-detail-title">' + esc(ttl(a)) + '</div><div class="manager-detail-meta">v' + esc(verifiedVersion) + '</div><div style="margin-top:10px"><span class="chip ok"><i class="ms" style="font-size:14px">verified</i> Original APK verified</span><span class="chip">Ready for patching</span></div></div></div></div>' +
      (sourceFailed || !hasConfiguredSource
        ? '<div class="manager-update-panel"><div class="status-title" style="justify-content:center"><i class="ms">warning</i><b>Patch source needs attention</b></div><div class="d" style="margin:10px 0">' + esc(info.build_status && info.build_status.reason ? info.build_status.reason : 'This app has no configured compatible patch source yet.') + '</div><button class="pill" data-a="go" data-h="sources"><i class="ms">source</i> Review patch sources</button></div>'
        : '<div class="manager-update-panel"><div class="status-title" style="justify-content:center"><i class="ms">verified</i><b>Original APK ready</b></div><div class="d" style="margin:10px 0">The exact original APK is verified. Choose patch options, then start a build.</div><button class="pill" data-a="dispatch_app" data-id="' + esc(a.id) + '"><i class="ms">auto_fix_high</i> Start patch</button><button class="pill o" data-a="go_patcher" data-id="' + esc(a.id) + '"><i class="ms">tune</i> Choose patches</button>') +
      '<div class="manager-page-card">' +
        '<div class="manager-detail-row"><i class="ms">inventory_2</i><div><div class="detail-label">Package name</div><div class="detail-value">' + esc(a.android_package || a.package || 'Not recorded') + '</div></div></div>' +
        '<div class="manager-detail-row"><i class="ms">update</i><div><div class="detail-label">Original APK version</div><div class="detail-value">v' + esc(verifiedVersion) + '</div></div></div>' +
        '<div class="manager-detail-row"><i class="ms">memory</i><div><div class="detail-label">Architecture</div><div class="detail-value">' + esc(verifiedArch) + '</div></div></div>' +
        '<div class="manager-detail-row"><i class="ms">source</i><div><div class="detail-label">Configured patch source</div><div class="detail-value">' + esc(sourceLabel) + '</div></div></div>' +
        '<div class="manager-detail-row"><i class="ms">done_all</i><div><div class="detail-label">Selected patches</div><div class="detail-value">' + selectedCount + ' of ' + patches.length + ' available patches selected</div></div></div>' +
      '</div>' +
      '<button class="pill manager-full-action secondary" data-a="help_find_apk" data-id="' + esc(a.id) + '"><i class="ms">download</i> Find another APK</button>';
  }
  if (!asset) {
    if (selected && selected !== 'Auto' && !versions.includes(selected)) versions.unshift(selected);
    if (recommended && !versions.includes(recommended)) versions.unshift(recommended);
    const rows = versions.length ? versions.map(v => '<label class="manager-version-row"><input class="manager-radio" type="radio" name="target-version" value="' + esc(v) + '" data-c="cfg_version" data-id="' + esc(a.id) + '" ' + (v===selected?'checked':'') + '><span class="manager-version-name">v' + esc(v) + '</span>' + (v===recommended?'<span class="manager-recommended"><i class="ms" style="font-size:14px">thumb_up</i> Recommended</span>':'') + '</label>').join('') : '<div class="d">No supported version list is published for this app yet. The build system will attempt automatic version resolution.</div>';
    return hdr(ttl(a), a.android_package || a.package, 1) +
      '<div class="manager-flow-title">Need help finding an original unpatched APK?</div>' +
      '<div class="manager-flow-subtitle">To patch <b>' + esc(ttl(a)) + '</b>, you need an unpatched APK of versions:</div>' +
      '<div class="manager-page-card">' + rows + '</div>' +
      '<button class="pill manager-full-action primary" data-a="help_find_apk" data-id="' + esc(a.id) + '"><i class="ms">download</i> Yes, help me find an APK</button>' +
      '<button class="pill manager-full-action secondary" data-a="dlg_upload_apk" data-id="' + esc(a.id) + '"><i class="ms">check</i> No, I already have an APK</button>' +
      '<div class="d" style="text-align:center;margin:16px 8px">We verify the package, version, signer and architecture before patching. Never upload an APK that has already been patched.</div>';
  }
  const sourceRows = (Array.isArray(a.patch_sources) && a.patch_sources.length ? a.patch_sources : (a.patches_repo?[a.patches_repo]:[]));
  const icon = appIconHtml(a);
  const relUrl = latestRel && latestRel.html_url ? latestRel.html_url : '';
  const releaseTag = latestRel ? latestRel.tag_name : '';
  const size = asset.size ? (asset.size >= 1048576 ? (asset.size/1048576).toFixed(2)+' MB' : (asset.size/1024).toFixed(0)+' KB') : 'Not recorded';
  const architectures = info.stock_apk && Array.isArray(info.stock_apk.architectures) && info.stock_apk.architectures.length ? info.stock_apk.architectures.join(' · ') : (a.arch || (S.config.settings && S.config.settings.default_arch) || 'Not recorded');
  const packageName = a.android_package || a.package || 'Not recorded';
  return hdr(ttl(a), 'v' + version, 1) +
    '<div class="manager-detail-hero"><div class="app-hero">' + icon + '<div class="hero-copy"><div class="manager-detail-title">' + esc(ttl(a)) + '</div><div class="manager-detail-meta">v' + esc(version) + '</div><div style="margin-top:10px"><span class="chip ok"><i class="ms" style="font-size:14px">verified</i> Patched APK</span><span class="chip">' + esc(ago(latestRel.published_at || latestRel.created_at)) + '</span></div></div></div></div>' +
    (hasUpdate ?

async function dispatchBuild(appId, force=true) {
  if (S.dirty) { toast('Save your changes first!', 1); return; }
  if (S.live && !S.live.done) { toast('A build is already being tracked.', 1); return; }

  const L = S.live = { lines: [], pct: 5, stage: 'Dispatching', done: false, ok: false, app: appId || '' };
  location.hash = '#/builds';

  try {
    // Ask GitHub to return the exact workflow_run_id created by this dispatch.
    // This avoids accidentally attaching the UI to another recent/cancelled run.
    const dispatch = await gh(`/actions/workflows/${S.wf}/dispatches`, {
      method: 'POST',
      body: JSON.stringify({
        ref: S.branch,
        inputs: { app: appId || '', force: !!force }
      })
    });

    L.lines.push(['INFO', 'Workflow dispatch initiated...']);
    paintLive();

    let runId = dispatch && dispatch.workflow_run_id ? dispatch.workflow_run_id : null;
    const seen = new Set();

    for (let k = 0; k < 250; k++) {
      await new Promise(r => setTimeout(r, 4000));

      // Fallback for GitHub installations that return 204 instead of run details.
      if (!runId) {
        const rs = (await gh(`/actions/runs?event=workflow_dispatch&branch=${encodeURIComponent(S.branch)}&per_page=20`)).workflow_runs || [];
        const candidates = rs
          .filter(r => r.head_branch === S.branch && Date.parse(r.created_at) >= t0)
          .sort((a, b) => b.id - a.id);
        if (candidates.length) runId = candidates[0].id;
      }
      if (!runId) continue;

      const run = await gh(`/actions/runs/${runId}`);
      if (!run || !run.id) continue;

      L.run = run.id;
      L.url = run.html_url;

      const st = (await gh(`/actions/runs/${run.id}/jobs`)).jobs.flatMap(j => j.steps || []);
      st.forEach(s => {
        const key = s.name + s.status + s.conclusion;
        if (s.status !== 'queued' && !seen.has(key)) {
          seen.add(key);
          L.lines.push([
            s.status === 'completed'
              ? (s.conclusion === 'success' ? 'SUCCESS' : 'ERROR')
              : 'INFO',
            s.name
          ]);
        }
      });

      // Progress is based on the five actual build phases, not GitHub's
      // setup/cleanup steps, so "15%" no longer looks like a frozen build.
      const phaseNames = ['Load Patches', 'Read APK', 'Execute Patches', 'Write Output', 'Sign APK'];
      const completed = phaseNames.filter(name =>
        st.some(s => s.name === name && s.status === 'completed' && s.conclusion === 'success')
      ).length;
      const workflowCompleted = st.filter(s => s.status === 'completed').length;
      const workflowTotal = st.length || 1;
      L.pct = run.status === 'completed'
        ? (run.conclusion === 'success' ? 100 : Math.max(10, Math.round((completed / phaseNames.length) * 100)))
        : Math.max(5, Math.round(Math.min(95, (workflowCompleted / workflowTotal) * 100)));

      L.stage = run.status === 'completed'
        ? (run.conclusion === 'success' ? 'Completed! 🎉' : 'Build Failed')
        : (run.status === 'in_progress' ? 'Build in progress' : run.status.replace('_', ' '));
      paintLive();

      if (run.status === 'completed') {
        L.done = true;
        L.ok = run.conclusion === 'success';
        await Promise.all([loadLocalCatalogs(), loadRels(), loadRuns(), checkLocalApks(), checkUpstreamUpdates()]);
        const builtAsset = latestPatchedAsset(appId ? app(appId) : (L.app ? app(L.app) : null));
        if (builtAsset) {
          L.downloadUrl = builtAsset.browser_download_url;
          L.releaseUrl = builtAsset.release.html_url;
          L.releaseTag = builtAsset.release.tag_name;
        } else {
          const candidate = S.rels.find(r => appId && r.tag_name.startsWith(appId + '-'));
          const fallbackAsset = candidate && (candidate.assets || []).find(x => /\.apk$/i.test(x.name));
          if (fallbackAsset) {
            L.downloadUrl = fallbackAsset.browser_download_url;
            L.releaseUrl = candidate.html_url;
            L.releaseTag = candidate.tag_name;
          }
        }
        paintLive();
        return;
      }
    }

    L.done = true;
    L.ok = false;
    L.stage = 'Build monitor timed out';
    L.lines.push(['ERROR', 'GitHub is still running or the run could not be located after 1000 seconds.']);
    paintLive();
  } catch(e) {
    L.done = true; L.stage = 'Dispatch Failed';
    L.lines.push(['ERROR', e.message]);
    paintLive();
  }
}


function systemStatus() {
  const sources = (S.config.sources || []).filter(x => x.enabled !== false);
  const apps = (S.config.apps || []).filter(a => !(S.config.hidden_apps || []).includes(a.id));
  const latestRun = S.runs && S.runs.length ? S.runs[0] : null;
  const readyApps = apps.filter(a => {
    const info = (S.cats[a.id] && S.cats[a.id].info) || {};
    return apkReadiness(a, info).state === 'ready';
  }).length;
  const failedBuild = latestRun && latestRun.conclusion === 'failure';
  const buildState = !latestRun ? 'unknown' : latestRun.status === 'in_progress' ? 'running' : latestRun.conclusion === 'success' ? 'ok' : failedBuild ? 'bad' : 'warn';
  return {
    repo: S.connected ? 'ok' : 'bad',
    sources: sources.length ? 'ok' : 'warn',
    apps: apps.length ? 'ok' : 'warn',
    apks: apps.length && readyApps === apps.length ? 'ok' : readyApps ? 'warn' : 'bad',
    build: buildState,
    signing: 'unknown',
    sourceCount: sources.length,
    appCount: apps.length,
    readyApps,
    latestRun
  };
}

function statusRow(label, state, detail) {
  const icons = { ok:'check_circle', warn:'warning', bad:'error', running:'sync', unknown:'help' };
  const labels = { ok:'Ready', warn:'Attention', bad:'Problem', running:'Running', unknown:'Check required' };
  const cls = state === 'ok' ? 'ok' : state === 'bad' ? 'bad' : state === 'warn' || state === 'running' ? 'warn' : '';
  return '<div class="row"><span class="status-icon '+cls+'" style="width:30px;height:30px"><i class="ms" style="font-size:18px">'+icons[state]+'</i></span><div class="g"><b>'+esc(label)+'</b><div class="d">'+esc(detail)+'</div></div><span class="chip '+cls+'">'+labels[state]+'</span></div>';
}

function doAddApp() {
  if (!newAppInspection || !newAppInspection.androidPackage) return toast('Confirm the exact Android package first.', 1);

  const selected = newAppInspection.matches[0];
  const repos = Array.from(new Set(newAppInspection.matches.map(x => x.repo)));
  const existing = appByPackage(newAppInspection.androidPackage);
  S.config.apps = Array.isArray(S.config.apps) ? S.config.apps : [];

  if (existing) {
    existing.name = existing.name || newAppInspection.name;
    existing.android_package = existing.android_package || newAppInspection.androidPackage;
    existing.patch_package = existing.patch_package || selected.package;
    existing.patch_sources = Array.isArray(existing.patch_sources) ? existing.patch_sources : (existing.patches_repo ? [existing.patches_repo] : []);
    for (const repo of repos) if (!existing.patch_sources.includes(repo)) existing.patch_sources.push(repo);
    existing.patches_repo = existing.patches_repo || repos[0];
    dirty(); closeDlg(); render();
    return toast(existing.name + ' was already configured; compatible sources were refreshed.');
  }

  const id = appIdFromName(newAppInspection.name, newAppInspection.androidPackage);
  const defArch = (S.config.settings && S.config.settings.default_arch) || 'arm64-v8a';
  const appConfig = {
    id,
    name: newAppInspection.name,
    package: newAppInspection.androidPackage,
    android_package: newAppInspection.androidPackage,
    patch_package: selected.package,
    patches_repo: repos[0],
    patch_sources: repos,
    prerelease: repos.some(repo => { const s = configuredSourceForRepo(repo); return s && s.prerelease === true; }),
    arch: defArch,
    apk_arch: 'auto',
    apk_providers: ['apkmirror','uptodown'],
    apk_sources: {},

    version: '',
    force: false,
    auto_patch: true,
    enable: [],
    disable: [],
    options: {}
  };
  S.config.apps.push(appConfig);

  dirty(); closeDlg(); render();
  toast(appConfig.name + ' added with ' + repos.length + ' compatible patch source(s). Save changes.');
}

function normalizeGithubRepo(value) {
  let v = String(value || '').trim();
  v = v.replace(/^https?:\/\/github\.com\//i, '');
  v = v.replace(/^git@github\.com:/i, '');
  v = v.replace(/^github\.com\//i, '');
  v = v.replace(/\.git$/i, '');
  v = v.replace(/^\/+|\/+$/g, '');
  const parts = v.split('/').filter(Boolean);
  if (parts.length < 2) return '';
  return parts.slice(0, 2).join('/');
}

async function inspectEnteredSource() {
  const repoInput = $('#n_src').value.trim();
  const repo = normalizeGithubRepo(repoInput);
  const pre = $('#sw_srcpre').classList.contains('on');
  if (!repo) return toast('Enter a valid GitHub repository, e.g. owner/repo', 1);
  const resDiv = $('#src_inspect_result');
  const addBtn = $('#btn_add_discovered');
  if (!repo) return toast('Enter owner/repo', 1);

  resDiv.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:12px 0"><i class="ms">sync</i> Inspecting repository...</div>`;
  addBtn.disabled = true;

  try {
    const rels = await gh(`https://api.github.com/repos/${repo}/releases?per_page=5`, {}, 1);
    if (!Array.isArray(rels) || !rels.length) throw new Error('No published releases found');
    const rel = rels.find(r => !r.draft && (pre || !r.prerelease)) || rels[0];
    const tag = rel.tag_name || rel.tagName;

    let patchesData = null;
    let sourceIconUrl = '';
    const iconPaths = [
      'assets/icons/icon-256.png',
      'assets/icon.png',
      'icon.png',
      'assets/icons/icon-128.png',
      'assets/icons/icon-512.png',
      'assets/icon.svg',
      'icon.svg'
    ];
    for (const path of iconPaths) {
      try {
        const ir = await gh('https://api.github.com/repos/' + repo + '/contents/' + path + '?ref=' + encodeURIComponent(tag), {}, 1);
        if (ir && ir.download_url) { sourceIconUrl = ir.download_url; break; }
      } catch(e) {}
    }
    const asset = (rel.assets || []).find(a => a.name === 'patches-list.json');
    if (asset) {
      try {
        const res = await fetch(asset.browser_download_url);
        if (res.ok) patchesData = await res.json();
      } catch(e) {}
    }

    if (!patchesData) {
      const rawUrls = [
        `https://raw.githubusercontent.com/${repo}/${tag}/patches-list.json`,
        `https://raw.githubusercontent.com/${repo}/main/patches-list.json`,
        `https://raw.githubusercontent.com/${repo}/master/patches-list.json`
      ];
      for (const u of rawUrls) {
        try {
          const res = await fetch(u);
          if (res.ok) { patchesData = await res.json(); break; }
        } catch(e) {}
      }
    }

    // Morphe's patches-list.json is normally an object:
    // { version: "...", patches: [...] }
    // Some third-party sources may expose the patch array directly, so support both.
    const patchEntries = Array.isArray(patchesData)
      ? patchesData
      : (patchesData && Array.isArray(patchesData.patches) ? patchesData.patches : []);

    const discoveredPkgs = new Set();
    const discoveredVersions = {};
    const addCompatibility = (pkg, versions) => {
      if (!pkg) return;
      const vals = Array.isArray(versions)
        ? versions
        : (versions && typeof versions === 'object'
          ? Object.values(versions).flatMap(v => Array.isArray(v) ? v : [v])
          : (versions == null ? [] : [versions]));
      discoveredPkgs.add(pkg);
      discoveredVersions[pkg] = Array.from(new Set([
        ...(discoveredVersions[pkg] || []),
        ...vals.map(v => typeof v === 'object' && v ? (v.version || '') : String(v || '')).filter(Boolean)
      ]));
    };
    patchEntries.forEach(p => {
      const cp = p && p.compatiblePackages;
      if (Array.isArray(cp)) {
        cp.forEach(x => {
          if (typeof x === 'string') addCompatibility(x, []);
          else if (x && typeof x === 'object') addCompatibility(x.packageName || x.package || x.name || '', x.versions || x.targets || []);
        });
      } else if (cp && typeof cp === 'object') {
        Object.entries(cp).forEach(([pkg, versions]) => addCompatibility(pkg, versions));
      }

      const compat = p && p.compatibility;
      if (Array.isArray(compat)) {
        compat.forEach(x => addCompatibility(
          x && (x.packageName || x.package || x.name),
          x && Array.isArray(x.targets) ? x.targets.map(t => t && t.version).filter(Boolean) : []
        ));
      } else if (compat && typeof compat === 'object') {
        Object.entries(compat).forEach(([pkg, data]) => addCompatibility(pkg, data));
      }
    });

    const pkgList = Array.from(discoveredPkgs);
    const mppAsset = (rel.assets || []).find(a => /\.mpp$/i.test(a.name));
    if (!pkgList.length && !mppAsset) throw new Error('The source did not expose a detectable package or .mpp bundle. Enter the package name manually.');
    newSourceInspection = {
      repo, tag, prerelease: pre,
      packages: pkgList,
      versions: discoveredVersions,
      iconUrl: sourceIconUrl,
      selectedPkg: pkgList[0] || '',
      releaseName: rel.name || tag,
      patchCount: patchEntries.length || null,
      bundleAsset: mppAsset ? mppAsset.name : ''
    };

    resDiv.innerHTML = `
      <div class="card" style="background:var(--card-high);margin:8px 0">
        <b>${esc(repo)}</b>
        <div class="d" style="margin-top:4px">
          Release <b>${esc(tag)}</b>
          · ${patchEntries.length || 'Unknown'} patch(es)
          · ${pkgList.length} compatible app(s)
          ${mppAsset ? ' · .mpp bundle detected' : ''}
        </div>
      </div>
      <div style="font-size:0.8rem;color:var(--sec);margin-bottom:6px">Select an app to add this source to:</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${pkgList.map((pkg, idx) => {
          const meta = getAppMeta(pkg);
          return `
            <span class="chip ${idx===0?'p':''}" style="padding:7px 12px;cursor:pointer" data-a="select_inspected_pkg" data-pkg="${esc(pkg)}">
              ${esc(meta.name)} (${esc(pkg)})
            </span>
          `;
        }).join('')}
      </div>
      <div class="lbl" style="margin-top:10px">Custom package name (if it was not detected)</div>
      <input type="text" id="custom_inspected_pkg" placeholder="com.example.app" value="${esc(pkgList[0] || '')}">
      <div class="d" style="margin-top:8px">
        The repository will be saved as a reusable patch source. If the selected app already exists, this source will be added to its source priority instead of replacing the current source.
      </div>
    `;
    addBtn.textContent = 'Add Source + App';
    addBtn.disabled = false;
  } catch(e) {
    resDiv.innerHTML = `<div class="warnb" style="margin:8px 0">Could not inspect automatically (${esc(e.message)}). Specify package manually:</div>
      <input type="text" id="custom_inspected_pkg" placeholder="com.example.app">`;
    newSourceInspection = { repo, tag: 'latest', prerelease: pre, packages: [], versions: {}, selectedPkg: '' };
    addBtn.disabled = false;
  }
}
