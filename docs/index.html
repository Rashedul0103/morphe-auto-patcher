<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Patch Manager</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&display=swap">
<style>:root{--primary:#A4C9FF;--bg:#1A1C1E;--card:#23262b;--sv:#43474E;--on:#E3E2E6;--out:#8D9199;--ok:#90D889;--err:#FFB4AB;--sec:#BCC7DB;--warn:#ffdea8;--pc:color-mix(in srgb,var(--primary) 26%,var(--bg));--onp:color-mix(in srgb,var(--primary) 18%,#000);--fs:16px}
:root.black{--bg:#000;--card:#111214}
:root.light{--bg:#FDFCFF;--card:#eef0f6;--sv:#dfe2eb;--on:#1A1C1E;--out:#73777F;--sec:#545F71;--onp:#fff;--ok:#286C2A;--err:#BA1A1A;--warn:#7C5800}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}body{font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--on);min-height:100dvh}
.ms{font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-style:normal;display:inline-block;user-select:none;vertical-align:middle}
#bg{position:fixed;inset:0;z-index:0;opacity:.45;pointer-events:none;width:100%;height:100%}
#main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 16px 120px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1E5AA8,#00AFAE);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none}
.top h1{font-size:1.25rem;font-weight:500;flex:1}.top small{display:block;font-size:.72rem;color:var(--out);font-weight:400}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--on);display:grid;place-items:center;cursor:pointer;flex:none}.ib:hover{background:#8883}
.card{background:var(--card);border-radius:24px;padding:14px;margin-bottom:10px;border:1px solid #8882}
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0d3a6d,#0a5959);color:#fff;border-radius:24px;padding:14px;margin-bottom:12px}.banner .s{font-size:.78rem;opacity:.75}
.grid{display:grid;gap:10px}@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}.grid .card{margin:0}
.app{display:flex;align-items:center;gap:12px;cursor:pointer}.app:hover{border-color:var(--primary)}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none;font-weight:700;font-size:1.4rem}
.n{font-weight:500;display:flex;gap:4px;align-items:center}.n .ms{font-size:16px;color:var(--primary)}
.mono{font:.72rem ui-monospace,monospace;color:var(--out);word-break:break-all}.chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:8px;background:var(--sv);margin:4px 4px 0 0}
.chip.ok{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}.chip.bad{background:color-mix(in srgb,var(--err) 22%,transparent);color:var(--err)}.chip.p{background:var(--pc);color:var(--primary)}
.pill{border:0;border-radius:20px;padding:9px 18px;background:var(--primary);color:var(--onp);font:500 .88rem Roboto;cursor:pointer;white-space:nowrap}.pill.t{background:none;color:var(--primary)}.pill.o{background:none;color:var(--primary);border:1px solid var(--out)}.pill:disabled{opacity:.4;cursor:default}.pill.d{background:var(--err);color:#000}
#dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:4px;background:var(--card);border:1px solid #8883;border-radius:32px;padding:6px;box-shadow:0 6px 24px #0007}
.bb{display:flex;flex-direction:column;align-items:center;min-width:68px;padding:8px 8px 6px;border-radius:24px;border:0;background:none;color:var(--on);font:500 .7rem Roboto;cursor:pointer;gap:2px}.bb.hl{background:var(--pc);color:var(--primary)}
@media(min-width:900px){#dock{left:14px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;border-radius:32px}#main{margin-left:max(104px,calc(50vw - 520px + 52px))}}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:12px 16px;border-radius:24px;border:1px solid var(--out);background:transparent;color:var(--on);font:1rem Roboto;outline:0}input:focus,select:focus{border-color:var(--primary)}select option{background:var(--card)}
.lbl{font-size:.75rem;color:var(--sec);margin:10px 4px 4px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:var(--sv);border:2px solid var(--out);flex:none;cursor:pointer;transition:.2s}.sw::after{content:"";position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:var(--out);transition:.2s}
.sw.on{background:var(--primary);border-color:var(--primary)}.sw.on::after{left:25px;top:3px;width:24px;height:24px;background:var(--onp)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}.row .g{flex:1;min-width:0}.row .d{font-size:.78rem;color:var(--out);margin-top:2px}
.seg{display:flex;background:var(--bg);border-radius:20px;padding:3px;margin-bottom:10px;border:1px solid #8882}.seg b{flex:1;text-align:center;padding:9px;border-radius:17px;font:500 .85rem Roboto;cursor:pointer}.seg b.on{background:var(--pc);color:var(--primary)}
.bar{height:10px;border-radius:5px;background:var(--sv);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1E5AA8,#00AFAE,#A4C9FF);background-size:200%;animation:sh 1.5s linear infinite;transition:width .3s}@keyframes sh{to{background-position:-200%}}
#term{background:#0a0b0c;color:#e3e2e6;border-radius:16px;padding:12px;font:.75rem/1.55 ui-monospace,monospace;max-height:340px;overflow-y:auto}.INFO{color:#8ab4f8}.SUCCESS{color:#90D889}.ERROR{color:#FFB4AB}.WARN{color:#fdd663}
.dlg-bg{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center}.dlg-bg.on{display:flex}
.dlg{background:var(--card);width:min(560px,100%);max-height:88vh;overflow-y:auto;border-radius:28px;padding:20px;animation:pop .2s ease-out}@keyframes pop{from{transform:scale(.94);opacity:0}}
@media(max-width:700px){.dlg-bg{align-items:flex-end}.dlg{border-radius:28px 28px 0 0;animation:up .25s ease-out}@keyframes up{from{transform:translateY(100%)}}}
.dlg h2{font-size:1.25rem;font-weight:500;margin-bottom:6px}.dlg p{font-size:.85rem;color:var(--sec);margin-bottom:12px}
.opts{margin:4px 0 8px;padding:10px;border-radius:16px;background:var(--bg)}.opts input,.opts select{margin-top:4px;padding:9px 14px}
.tabs{display:flex;background:var(--card);border-radius:24px;padding:4px;margin-bottom:12px}.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--out);cursor:pointer;padding:6px;border-radius:20px}.tab.on{background:var(--pc);color:var(--primary)}
.sw-c{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:grid;place-items:center;color:#000}.sw-c.on{border-color:var(--on)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#e3e2e6;color:#1a1c1e;padding:10px 18px;border-radius:14px;font-size:.85rem;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:92vw}.toast.on{opacity:1}.toast.bad{background:#ffb4ab}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite;flex:none}@keyframes p{50%{opacity:.3}}
.fab{position:fixed;right:16px;bottom:96px;z-index:9;box-shadow:0 6px 20px #0008;padding:14px 20px}@media(min-width:900px){.fab{bottom:24px;right:24px}}
.warnb{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-radius:16px;padding:10px 14px;font-size:.82rem;margin-bottom:10px}
.sec-h{font-size:.85rem;color:var(--primary);font-weight:500;margin:14px 4px 6px}.x{color:var(--err)!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="bg"></canvas><div id="main"></div>
<button class="pill fab" id="fab" data-a="save" style="display:none"><i class="ms" style="margin-right:6px;font-size:20px">save</i>Save changes</button>
<div id="dock"><button class="bb" data-nav="home" data-a="go" data-h=""><i class="ms">home</i>Apps</button><button class="bb" data-a="addsrc"><i class="ms">source</i>Sources</button><button class="bb" data-nav="builds" data-a="go" data-h="builds"><i class="ms">construction</i>Builds</button><button class="bb" data-nav="settings" data-a="go" data-h="settings"><i class="ms">settings</i>Settings</button></div>
<div class="dlg-bg" id="dbg"><div class="dlg" id="dlg"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const b64 = s => {
  try {
    const bin = atob(s.replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  } catch(e) { return '{}'; }
};
const u64 = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
};

const LS='patch-manager-cfg';
const PK={'com.google.android.youtube':['YouTube','#e53935,#b71c1c'],'com.google.android.apps.youtube.music':['YouTube Music','#ff7043,#d84315'],'com.reddit.frontpage':['Reddit','#ff8f00,#e65100']};
const ARCH=['arm64-v8a','armeabi-v7a','x86','x86_64'],EXT=/\.(apk|apkm|apks|xapk|axapk)$/i;
const S={owner:'',repo:'',branch:'main',token:'',wf:'build.yml',expert:false,black:false,mode:'system',accent:'#A4C9FF',scale:100,sort:'order',filter:'all',confirm:true,config:{apps:[]},sha:'',cats:{},rels:[],runs:[],dirty:false,pm:'simple',onlySel:false,live:null,connected:false};

if(/github\.io$/.test(location.hostname)){S.owner=location.hostname.split('.')[0];S.repo=location.pathname.split('/')[1]||''}
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const persist=()=>{const{owner,repo,branch,token,wf,expert,black,mode,accent,scale,sort,filter,confirm}=S;localStorage.setItem(LS,JSON.stringify({owner,repo,branch,token,wf,expert,black,mode,accent,scale,sort,filter,confirm}))};
const sw=(on,attrs)=>`<div class="sw ${on?'on':''}" ${attrs}></div>`,A={},C={};
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='toast on'+(bad?' bad':'');clearTimeout(e.t);e.t=setTimeout(()=>e.className='toast',3200)}

async function gh(path,o={},raw){
  const r=await fetch(raw?path:'https://api.github.com/repos/'+S.owner+'/'+S.repo+path,{...o,headers:{Authorization:'Bearer '+S.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(o.body?{'Content-Type':'application/json'}:{}),...(o.headers||{})}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const er=new Error('GitHub '+r.status+(m?': '+m:''));er.status=r.status;throw er}
  return r.status==204?null:r.json()
}

const app=id=>S.config.apps.find(a=>a.id===id),ttl=a=>(PK[a.package]||[])[0]||a.id,dirty=()=>{S.dirty=true;$('#fab').style.display='block'};
const hue=a=>{const h=[...a.id].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7)%360;return PK[a.package]?PK[a.package][1]:`hsl(${h} 55% 45%),hsl(${h} 55% 28%)`};
const eff=(a,p)=>(a.enable||[]).includes(p.name)?true:(a.disable||[]).includes(p.name)?false:!!p.enabled;
const ago=d=>{const s=(Date.now()-Date.parse(d))/1e3;return s<90?'just now':s<5400?Math.round(s/60)+' min ago':s<129600?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
function relsFor(id){const ids=S.config.apps.map(a=>a.id).filter(x=>x!==id&&x.startsWith(id+'-'));return S.rels.filter(r=>!r.draft&&r.tag_name.startsWith(id+'-')&&!ids.some(x=>r.tag_name.startsWith(x+'-')))}
const stockRel=id=>S.rels.find(r=>r.tag_name==='stock-'+id),stockFiles=id=>((stockRel(id)||{}).assets||[]).filter(x=>EXT.test(x.name));

/* data */
async function connect(quiet){
  if(!S.owner||!S.repo||!S.token)return dlgConnect();
  try{
    try{
      const d=await gh('/contents/config.json?ref='+encodeURIComponent(S.branch));
      S.sha=d.sha;S.config=JSON.parse(b64(d.content));
    }catch(e){
      if(e.status!=404)throw e;
      S.sha='';S.config={apps:[]};toast('No config.json yet, starting a new one');
    }
    if(!Array.isArray(S.config.apps))S.config.apps=[];
    S.connected=true;S.dirty=false;persist();closeDlg();render();
    await Promise.all([loadCats(),loadRels(),loadRuns()]);
    render();if(!quiet)toast('Connected');
  }catch(e){
    S.connected=false;toast(e.message,1);if(!quiet)dlgConnect();render();
  }
}

async function loadCat(id){
  try {
    let patches = null, info = null;
    try {
      const pRes = await fetch('catalog/' + encodeURIComponent(id) + '.json?t=' + Date.now());
      if (pRes.ok) patches = await pRes.json();
      const iRes = await fetch('catalog/' + encodeURIComponent(id) + '.info.json?t=' + Date.now());
      if (iRes.ok) info = await iRes.json();
    } catch(e){}

    if (!patches) {
      const d = await gh('/contents/docs/catalog/' + encodeURIComponent(id) + '.json?ref=' + encodeURIComponent(S.branch));
      patches = JSON.parse(b64(d.content));
      try {
        info = JSON.parse(b64((await gh('/contents/docs/catalog/' + encodeURIComponent(id) + '.info.json?ref=' + encodeURIComponent(S.branch))).content));
      } catch(e){}
    }
    S.cats[id] = { patches, info };
  } catch(e){
    S.cats[id] = null;
  }
}

const loadCats=()=>Promise.all(S.config.apps.map(a=>loadCat(a.id)));
async function loadRels(){try{S.rels=await gh('/releases?per_page=100')}catch(e){S.rels=[]}}
async function loadRuns(){try{S.runs=(await gh('/actions/runs?per_page=15')).workflow_runs}catch(e){S.runs=[]}}

async function save(){
  try{
    const r=await gh('/contents/config.json',{method:'PUT',body:JSON.stringify({message:'Update config from Patch Manager',branch:S.branch,content:u64(JSON.stringify(S.config,null,2)+'\n'),...(S.sha?{sha:S.sha}:{})})});
    S.sha=r.content.sha;S.dirty=false;render();toast('Saved. A build starts from the push trigger');watchCats();
  }catch(e){
    toast(e.status==409||e.status==422?'config.json changed on GitHub. Reconnect to refresh':e.message,1);
  }
}

let wc=0;
async function watchCats(){
  const n=++wc;
  for(let i=0;i<40&&n==wc;i++){
    await new Promise(r=>setTimeout(r,8000));
    const miss=S.config.apps.filter(a=>!S.cats[a.id]);
    if(!miss.length){await loadRuns();render();return}
    await Promise.all(miss.map(a=>loadCat(a.id)));
    await loadRels();render();
  }
}

/* router */
const route=()=>{const p=location.hash.replace(/^#\/?/,'').split('/');return{v:p[0]||'home',id:decodeURIComponent(p[1]||'')}};
addEventListener('hashchange',()=>{render();if(route().v=='builds')loadRuns().then(paintHist)});

function theme(){
  const d=document.documentElement,light=S.mode=='light'||(S.mode=='system'&&matchMedia('(prefers-color-scheme: light)').matches);
  d.classList.toggle('light',light);d.classList.toggle('black',S.black&&!light);
  d.style.setProperty('--primary',S.accent);d.style.setProperty('--fs',16*S.scale/100+'px');
}

function render(){
  const r=route(),m=$('#main'),nav={home:'home',app:'home',builds:'builds',settings:'settings'}[r.v]||'home';
  document.querySelectorAll('.bb[data-nav]').forEach(b=>b.classList.toggle('hl',b.dataset.nav==nav));
  $('#fab').style.display=S.dirty?'block':'none';
  m.innerHTML=({home:vHome,app:vApp,builds:vBuilds,settings:vSet}[r.v]||vHome)(r);
  if(r.v=='builds')paintLive();
}

const hdr=(t,sub,back)=>`<div class="top">${back?`<button class="ib" data-a="go" data-h="">${'<i class="ms">arrow_back</i>'}</button>`:'<div class="logo">P</div>'}<h1>${esc(t)}<small>${esc(sub||'')}</small></h1>${back?'':'<button class="ib" data-a="go" data-h="settings"><i class="ms">settings</i></button>'}</div>`;

/* home */
function appCard(a){
  const c=S.cats[a.id],rl=relsFor(a.id)[0],sf=stockFiles(a.id),k=c?c.patches.filter(p=>eff(a,p)).length:0;
  return`<div class="card app" data-a="open" data-id="${esc(a.id)}"><div class="ico" style="background:linear-gradient(135deg,${hue(a)})">${esc(ttl(a)[0].toUpperCase())}</div><div style="flex:1;min-width:0"><div class="n">${esc(ttl(a))}<i class="ms">verified</i></div><div class="mono">${esc(a.package)}</div>
 ${c?`<span class="chip">${k} of ${c.patches.length} patches</span>`:'<span class="chip bad">No patch list yet</span>'}${c&&c.info?`<span class="chip">${esc(c.info.patch_tag||'')}</span>`:''}<span class="chip">${esc(a.version||(c&&c.info&&c.info.recommended_version)||'Latest')}</span>${a.prerelease?'<span class="chip p">Pre-release</span>':''}${S.connected?(sf.length?'<span class="chip ok">APK ready</span>':'<span class="chip bad">APK missing</span>'):''}
 <div class="mono" style="margin-top:4px;font-family:inherit">${rl?'Patched '+ago(rl.published_at||rl.created_at):'Not patched yet'}</div></div><button class="pill" data-a="build" data-id="${esc(a.id)}">Patch</button></div>`;
}

function listApps(){
  const q=($('#asearch')||{}).value?.toLowerCase()||'';
  let l=S.config.apps.filter(a=>(ttl(a)+a.package+a.id).toLowerCase().includes(q));
  l=l.filter(a=>S.filter=='all'||(S.filter=='patched'?relsFor(a.id).length:S.filter=='not'?!relsFor(a.id).length:!stockFiles(a.id).length));
  if(S.sort=='name')l.sort((a,b)=>ttl(a).localeCompare(ttl(b)));
  if(S.sort=='patched')l.sort((a,b)=>Date.parse((relsFor(b.id)[0]||{}).created_at||0)-Date.parse((relsFor(a.id)[0]||{}).created_at||0));
  return l.length?`<div class="grid">${l.map(appCard).join('')}</div>`:`<div class="card" style="text-align:center"><b>${S.config.apps.length?'No apps match':'No apps available'}</b><div class="d" style="color:var(--out);font-size:.85rem;margin:4px 0 12px">${S.config.apps.length?'Change the search or filter':'Add a patch source to get started'}</div>${S.config.apps.length?'':'<button class="pill" data-a="addsrc">Add source</button>'}</div>`;
}

function vHome(){
  const lr=S.runs[0],n=S.config.apps.length;
  return hdr('Patch Manager',S.connected?`${S.owner}/${S.repo} · ${S.branch}`:'Web manager · not connected')+`<div class="banner"><i class="ms" style="font-size:32px">${S.connected?'cloud_done':'cloud_off'}</i><div style="flex:1"><div style="font-weight:500">${S.connected?'Connected to GitHub':'Connect a repository'}</div><div class="s">${n} app${n==1?'':'s'}${S.dirty?' · unsaved changes':''}${lr?' · last build '+esc(lr.conclusion||lr.status):''}</div></div>${S.connected?'<div class="dot"></div>':'<button class="pill" style="background:#fff;color:#000" data-a="conn">Connect</button>'}</div>
 <div style="display:flex;gap:8px;margin-bottom:10px"><input type="text" id="asearch" placeholder="Search apps" data-c="srch" style="flex:1"><button class="pill o" data-a="sort"><i class="ms" style="font-size:18px">sort</i> ${{order:'Config order',name:'Name',patched:'Recently patched'}[S.sort]}</button><button class="pill ${S.filter!='all'?'':'o'}" data-a="filt">${{all:'All',patched:'Patched',not:'Not patched',missing:'APK missing'}[S.filter]}</button></div><div id="apps">${listApps()}</div>`;
}

/* app screen */
const optCtl=(a,p,o)=>{
  const v=((a.options||{})[p.name]||{})[o.key]??'',d=String(o.default??''),bool=/^(true|false)$/i.test(d),cur=v===''?d:v,at=`data-c="opt" data-p="${esc(p.name)}" data-k="${esc(o.key)}"`;
  return`<div style="margin-top:8px;font-size:.78rem;color:var(--sec)">${esc(o.title||o.key)}${o.description?' · '+esc(o.description):''}${bool?`<div class="row" style="padding:4px 0"><div class="g">${cur}</div>${sw(cur.toLowerCase()=='true',`data-a="optsw" data-p="${esc(p.name)}" data-k="${esc(o.key)}" data-d="${esc(d)}"`)}</div>`:`<input type="${/^-?\d+(\.\d+)?$/.test(d)?'number':'text'}" ${at} value="${esc(v)}" placeholder="${esc(d||'Default')}">`}</div>`;
};

function plist(a){
  const c=S.cats[a.id],q=($('#psq')||{}).value?.toLowerCase()||'';
  if(!c)return'';
  let h='';
  c.patches.filter(p=>(!q||(p.name+p.description).toLowerCase().includes(q))&&(!S.onlySel||eff(a,p))).forEach(p=>{
    const on=eff(a,p),cu=a.options&&a.options[p.name];

async function build(id){
  if(S.dirty){toast('Save your changes first so the build uses them',1);return}
  if(S.confirm&&!confirm(id?'Start a build for '+ttl(app(id))+'?':'Start a build for all apps?'))return;
  const L=S.live={lines:[],pct:2,stage:'Starting',done:false,ok:false},log=(t,m)=>{L.lines.push([t,m]);paintLive()};location.hash='#/builds';
  try{
    const t0=Date.now()-8000;
    await gh(`/actions/workflows/${S.wf}/dispatches`,{method:'POST',body:JSON.stringify({ref:S.branch,inputs:{app:id||'',force:true}})});
    log('INFO','Workflow dispatched');const seen=new Set();
    for(let k=0;k<300;k++){
      await new Promise(r=>setTimeout(r,4000));
      const rs=(await gh(`/actions/runs?event=workflow_dispatch&branch=${encodeURIComponent(S.branch)}&per_page=5`)).workflow_runs,run=rs.find(r=>Date.parse(r.created_at)>=t0);
      if(!run)continue;
      L.run=run.id;L.url=run.html_url;
      const st=(await gh(`/actions/runs/${run.id}/jobs`)).jobs.flatMap(j=>j.steps||[]);
      st.forEach(s=>{
        const key=s.name+s.status;
        if(s.status!='queued'&&!seen.has(key)){
          seen.add(key);
          log(s.status=='completed'?(s.conclusion=='success'?'SUCCESS':s.conclusion=='skipped'?'INFO':'ERROR'):'INFO',s.name);
        }
      });
      L.pct=st.length?Math.max(4,Math.round(st.filter(s=>s.status=='completed').length/st.length*100)):4;
      L.stage=run.status=='completed'?(run.conclusion=='success'?'All done! 🎉':'Build '+run.conclusion):run.status.replace('_',' ');paintLive();
      if(run.status=='completed'){
        L.done=true;L.ok=run.conclusion=='success';
        if(!L.ok)log('WARN','If the stock APK is missing, upload it on GitHub Releases and run again');
        paintLive();await Promise.all([loadRels(),loadCats(),loadRuns()]);paintLive();return;
      }
    }
    log('ERROR','No run found. Check the Actions tab');
  }catch(e){
    log('ERROR',e.message);L.done=true;L.stage='Build failed';paintLive();
  }
}

/* stock upload */
async function upload(id,f){
  if(!f)return;
  const bar=$('#upbar'),p=$('#upp'),t=$('#upt');
  if(!EXT.test(f.name))return toast('Use an APK or APKM file',1);
  try{
    let rel=stockRel(id);
    if(!rel){
      try{rel=await gh('/releases/tags/stock-'+id)}
      catch(e){
        if(e.status!=404)throw e;
        rel=await gh('/releases',{method:'POST',body:JSON.stringify({tag_name:'stock-'+id,name:'Stock APK for '+id,body:'Original APK files used for patching '+id,target_commitish:S.branch,prerelease:false})});
      }
    }
    const nm=f.name,old=(rel.assets||[]).find(x=>x.name==nm);
    if(old)await gh('/releases/assets/'+old.id,{method:'DELETE'});
    bar.style.display='block';

    await new Promise((ok,no)=>{
      const x=new XMLHttpRequest();
      x.open('POST',`https://uploads.github.com/repos/${S.owner}/${S.repo}/releases/${rel.id}/assets?name=${encodeURIComponent(nm)}`);
      x.setRequestHeader('Authorization','Bearer '+S.token);
      x.setRequestHeader('Content-Type','application/octet-stream');
      x.setRequestHeader('Accept','application/vnd.github+json');
      x.upload.onprogress=e=>{
        if(e.lengthComputable){
          p.style.width=e.loaded/e.total*100+'%';
          t.textContent='Uploading '+Math.round(e.loaded/e.total*100)+'%';
        }
      };
      x.onload=()=>x.status<300?ok():no(new Error('Upload failed ('+x.status+')'));
      x.onerror=()=>no(new Error('Browser blocked upload. Please upload directly on GitHub Releases page.'));
      x.send(f);
    });
    await loadRels();toast('Stock APK uploaded');render();
  }catch(e){
    toast(e.message,1);
    bar.style.display='none';
  }
}

function setOpt(a,pn,k,v){
  a.options=a.options||{};const o=a.options[pn]=a.options[pn]||{};
  if(v==='')delete o[k];else o[k]=v;
  if(!Object.keys(o).length)delete a.options[pn];
  dirty();
}

Object.assign(C,{
  srch:()=>$('#apps').innerHTML=listApps(),
  psrch:()=>{const a=app(route().id);$('#plist').innerHTML=plist(a)},
  accent:e=>{S.accent=e.value;persist();theme()},
  scale:e=>{S.scale=+e.value;persist();theme();render()},
  wf:e=>{S.wf=e.value.trim()||'build.yml';persist()},
  branch:e=>{S.branch=e.value.trim()||'main';persist()},
  cfg:e=>{const a=app(route().id);a[e.dataset.k]=e.value.trim();dirty()},
  opt:e=>{setOpt(app(route().id),e.dataset.p,e.dataset.k,e.value.trim())},
  upload:e=>upload(e.dataset.id,e.files[0]),
  imp:e=>{const f=e.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.apps))throw 0;S.config=j;dirty();render();toast('Imported. Save to push it')}catch(x){toast('Not a valid config.json',1)}})}
});

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,e)});
document.addEventListener('input',e=>{const n=e.target.dataset&&e.target.dataset.c;if(n=='srch'||n=='psrch')C[n](e.target)});
document.addEventListener('change',e=>{const n=e.target.dataset&&e.target.dataset.c;if(n&&n!='srch'&&n!='psrch')C[n](e.target)});
$('#dbg').addEventListener('click',e=>{if(e.target.id=='dbg')closeDlg()});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',theme);

(function(){
  const c=$('#bg'),x=c.getContext('2d');let w,h,o=[];
  function r(){w=c.width=innerWidth;h=c.height=innerHeight;o=[...Array(6)].map(()=>({x:Math.random()*w,y:Math.random()*h,r:60+Math.random()*120,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2}))}
  r();addEventListener('resize',r);
  (function f(){x.clearRect(0,0,w,h);o.forEach(a=>{a.x=(a.x+a.vx+w)%w;a.y=(a.y+a.vy+h)%h;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fillStyle='rgba(30,90,168,.08)';x.fill()});requestAnimationFrame(f)})();
})();

theme();render();
if(S.token&&S.owner&&S.repo)connect(1);else if(!S.token)setTimeout(dlgConnect,300);
</script></body></html>
