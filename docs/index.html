    addDiscoveredApp(t.dataset.pkg, repos);
  },
  source_down: t => {
    const a = app(t.dataset.id); if (!a) return;
    a.patch_sources = Array.isArray(a.patch_sources) ? a.patch_sources : (a.patches_repo ? [a.patches_repo] : []);
    const i = +t.dataset.idx;
    if (i < 0 || i >= a.patch_sources.length - 1) return;
    [a.patch_sources[i], a.patch_sources[i + 1]] = [a.patch_sources[i + 1], a.patch_sources[i]];
    a.patches_repo = a.patch_sources[0] || a.patches_repo;
    dirty(); render();
  },
  toggle_autopatch: t => {
    const a = app(t.dataset.id);
    if (!a) return;
    a.auto_patch = (a.auto_patch === false) ? true : false;
    dirty();
    render();
    toast(`${ttl(a)} Auto-Patch: ${a.auto_patch ? 'Enabled' : 'Disabled'}`);
  },
  addapp: dlgAddApp,
  addpatchsource: dlgAddSource,
  addsrc: dlgAddSource,
  inspect_app: inspectAppEntry,
  do_add_app: doAddApp,
  inspect_src: inspectEnteredSource,
  select_inspected_pkg: t => {
    document.querySelectorAll('#src_inspect_result .chip').forEach(c => c.classList.remove('p'));
    t.classList.add('p');
    $('#custom_inspected_pkg').value = t.dataset.pkg;
    if (newSourceInspection) newSourceInspection.selectedPkg = t.dataset.pkg;
  },
  do_add_inspected: () => {
    if (!newSourceInspection) return;
    const pkg = ($('#custom_inspected_pkg') || {}).value?.trim() || newSourceInspection.selectedPkg;
    if (!pkg) return toast('Please specify package name', 1);

    const parts = pkg.split('.');
    const id = (parts[parts.length - 1] || 'app').toLowerCase();
    const defArch = (S.config.settings && S.config.settings.default_arch) || 'arm64-v8a';

    S.config.sources = Array.isArray(S.config.sources) ? S.config.sources : [];
    const existingSource = S.config.sources.find(x => x.repo === newSourceInspection.repo);
    const sourceRecord = {
      repo: newSourceInspection.repo,
      enabled: existingSource ? existingSource.enabled !== false : true,
      prerelease: newSourceInspection.prerelease,
      tag: newSourceInspection.tag,
      release_name: newSourceInspection.releaseName || newSourceInspection.tag,
      patch_count: newSourceInspection.patchCount,
      icon_url: newSourceInspection.iconUrl || '',
      apps: newSourceInspection.packages.map(p => ({ package: p, name: getAppMeta(p).name })),
      last_inspected: new Date().toISOString()
    };
    if (existingSource) Object.assign(existingSource, sourceRecord);
    else S.config.sources.push(sourceRecord);

    S.config.apps = S.config.apps || [];
    let a = S.config.apps.find(x => x.id === id);
    if (!a) {
      a = {
        id, package: pkg, patches_repo: newSourceInspection.repo,
        patch_sources: [newSourceInspection.repo],
        prerelease: newSourceInspection.prerelease,
        arch: defArch, apk_arch: 'auto', version: (((newSourceInspection.versions || {})[pkg] || [])[0] || ''), force: false,
        auto_patch: true, icon_url: newSourceInspection.iconUrl || officialIconUrl({package: pkg}), enable: [], disable: [], options: {}
      };
      S.config.apps.push(a);
    } else {
      a.patch_sources = Array.isArray(a.patch_sources) ? a.patch_sources : [];
      if (!a.patch_sources.includes(newSourceInspection.repo)) a.patch_sources.push(newSourceInspection.repo);
      if (!a.patches_repo) a.patches_repo = newSourceInspection.repo;
      if (!a.version) a.version = (((newSourceInspection.versions || {})[pkg] || [])[0] || a.version || '');
      if (!a.icon_url) a.icon_url = newSourceInspection.iconUrl || officialIconUrl(a);
    }

    dirty();
    closeDlg();
    loadLocalCatalogs().then(render);
    toast(`Source added. ${ttl(a)} now uses ${a.patch_sources.length} source(s) ✔ Save changes`);
  },
  conn: dlgConnect,
  close: closeDlg,
  save: save,
  toggle_only_sel: () => { S.onlySel = !S.onlySel; render(); },
  bulk: t => {
    const a = app(t.dataset.id); if (!a) return;
    const cat = S.cats[a.id]; if (!cat) return;
    a.enable = []; a.disable = [];
    if (t.dataset.v !== 'rec') {
      cat.patches.forEach(p => {
        if ((t.dataset.v === 'all') !== !!p.enabled) {
          (t.dataset.v === 'all' ? a.enable : a.disable).push(p.name);
        }
      });
    }
    dirty(); render();
  },
  pt: t => {
    const a = app(t.dataset.id); if (!a) return;
    const cat = S.cats[a.id]; if (!cat) return;
    const p = cat.patches.find(x => x.name === t.dataset.n); if (!p) return;
    const on = !eff(a, p);
    a.enable = (a.enable || []).filter(n => n !== p.name);
    a.disable = (a.disable || []).filter(n => n !== p.name);
    if (on !== !!p.enabled) (on ? a.enable : a.disable).push(p.name);
    dirty();
    t.classList.toggle('on', on);
  },
  sw_autoprune: t => {
    S.config.settings = S.config.settings || {};
    const cur = S.config.settings.auto_prune !== false;
    S.config.settings.auto_prune = !cur;
    t.classList.toggle('on', !cur);
    dirty();
  },
  sw_discord_patchsource: t => {
    S.config.settings = S.config.settings || {};
    const cur = S.config.settings.notify_patch_source_failure !== false;
    S.config.settings.notify_patch_source_failure = !cur;
    t.classList.toggle('on', !cur);
    dirty();
  },
  sw_discord_patching: t => {
    S.config.settings = S.config.settings || {};
    const cur = S.config.settings.notify_patching_failure !== false;
    S.config.settings.notify_patching_failure = !cur;
    t.classList.toggle('on', !cur);
    dirty();
  },
  sw_discord_validation: t => {
    S.config.settings = S.config.settings || {};
    const cur = S.config.settings.notify_output_validation_failure !== false;
    S.config.settings.notify_output_validation_failure = !cur;
    t.classList.toggle('on', !cur);
    dirty();
  },
  sw_discord_publishing: t => {
    S.config.settings = S.config.settings || {};
    const cur = S.config.settings.notify_release_publishing_failure !== false;
    S.config.settings.notify_release_publishing_failure = !cur;
    t.classList.toggle('on', !cur);
    dirty();
  },
  sw_srcpre: t => t.classList.toggle('on'),
  doconn: () => {
    S.owner = $('#c_owner').value.trim();
    S.repo = $('#c_repo').value.trim();
    S.branch = $('#c_branch').value.trim() || 'main';
    S.token = $('#c_token').value.trim();
    connect();
  },
  set_theme: t => { S.mode = t.dataset.v; persist(); theme(); render(); },
  sw_black: t => { S.black = !S.black; persist(); theme(); render(); },
  set_stab: t => { settingsTab = +t.dataset.v; render(); },
  set_scale: t => { S.scale = +t.dataset.v || 100; persist(); theme(); render(); },
  unhide: t => {
    S.config.hidden_apps = (S.config.hidden_apps || []).filter(x => x !== t.dataset.id);
    dirty(); render();
  },
  dlg_opt_sw: t => {
    t.classList.toggle('on');
    const a = app(t.dataset.id); if (!a) return;
    a.options = a.options || {};
    a.options[t.dataset.p] = a.options[t.dataset.p] || {};
    a.options[t.dataset.p][t.dataset.k] = t.classList.contains('on');
    dirty();
  },
  dlg_opt_reset: t => {
    const a = app(t.dataset.id); if (!a) return;
    if (a.options && a.options[t.dataset.p]) {
      delete a.options[t.dataset.p];
      dirty();
      closeDlg();
      openPatchOptions(t.dataset.id, t.dataset.p);
    }
  }
});

Object.assign(C, {
  source_search: e => {
    S.sourceSearch = e.value;
    render();
  },
  patch_search: e => {
    S.patchSearch = S.patchSearch || {};
    S.patchSearch[e.dataset.id] = e.value;
    render();
  },
  cfg: e => {
    const a = app(route().id);
    if (a) { a[e.dataset.k] = e.value.trim(); dirty(); }
  },
  cfg_version: e => {
    const a = app(e.dataset.id);
    if (!a || !e.value) return;
    a.version = e.value;
    dirty();
    render();
  },
  cfg_st: e => {
    S.config.settings = S.config.settings || {};
    S.config.settings[e.dataset.k] = e.value;
    dirty();
  },
  dlg_opt_val: e => {
    const a = app(e.dataset.id); if (!a) return;
    a.options = a.options || {};
    a.options[e.dataset.p] = a.options[e.dataset.p] || {};
    const value = e.dataset.type === 'number' && e.value !== '' ? Number(e.value) : e.value;
    a.options[e.dataset.p][e.dataset.k] = value;
    dirty();
  }
});

document.addEventListener('click', e => {
  if (Date.now() < suppressCardClickUntil) return;
  const t = e.target.closest('[data-a]');
  if (t && A[t.dataset.a]) { A[t.dataset.a](t, e); return; }
  if (e.target.closest('a,button,input,select,textarea,label,.menu-wrap,[data-a]')) return;
  const card = e.target.closest('.manager-home-card[data-id]');
  if (card) location.hash = '#/app/' + encodeURIComponent(card.dataset.id);
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'home-search') {
    S.homeSearch = e.target.value;
    applyHomeSearch(S.homeSearch);
  }
});

document.addEventListener('change', e => {
  const n = e.target.dataset && e.target.dataset.c;
  if (n && C[n]) C[n](e.target);
  if (e.target && e.target.id === 'stock_apk_file') {
    const id = e.target.dataset.appId;
    const file = e.target.files && e.target.files[0];
    if (id && file) uploadStockApk(id, file).catch(err => {
      toast(err.message, 1);
      openUploadApkDialog(id);
    });
  }
});
$('#dbg').addEventListener('click', e => { if (e.target.id === 'dbg') closeDlg(); });
matchMedia('(prefers-color-scheme: light)').addEventListener('change', theme);

(function(){
  const c = $('#bg'), x = c.getContext('2d'); let w, h, o = [];
  function r() {
    w = c.width = innerWidth; h = c.height = innerHeight;
    o = [...Array(6)].map(() => ({ x: Math.random()*w, y: Math.random()*h, r: 60 + Math.random()*120, vx: (Math.random() - 0.5)*0.2, vy: (Math.random() - 0.5)*0.2 }));
  }
  r(); addEventListener('resize', r);
  (function f(){
    x.clearRect(0,0,w,h);
    o.forEach(a => {
      a.x = (a.x + a.vx + w) % w; a.y = (a.y + a.vy + h) % h;
      x.beginPath(); x.arc(a.x, a.y, a.r, 0, 7);
      x.fillStyle = 'rgba(30,90,168,0.08)'; x.fill();
    });
    requestAnimationFrame(f);
  })();
})();

function syncInstallAction() {
  const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  document.querySelectorAll('[data-a="install_app"]').forEach(button => {
    button.hidden = installed || !deferredInstallPrompt;
  });
}

window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredInstallPrompt = event;
  syncInstallAction();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  syncInstallAction();
});

theme(); render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Service worker registration failed:', error));
}
if (S.token && S.owner && S.repo) connect(1); else if (!S.token) setTimeout(dlgConnect, 300);
</script>
</body>
</html>
