<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patch Manager</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&display=swap">
<style>
:root {
  --primary: #A4C9FF; --bg: #1A1C1E; --card: #23262b; --card-high: #2d3037; --sv: #43474E;
  --on: #E3E2E6; --out: #8D9199; --ok: #90D889; --err: #FFB4AB; --sec: #BCC7DB; --warn: #ffdea8;
  --pc: color-mix(in srgb, var(--primary) 26%, var(--bg));
  --onp: color-mix(in srgb, var(--primary) 18%, #000);
  --fs: 16px;
}
:root.black { --bg: #000; --card: #111214; --card-high: #1c1d21; }
:root.light {
  --bg: #FDFCFF; --card: #eef0f6; --card-high: #e2e5ee; --sv: #dfe2eb; --on: #1A1C1E; --out: #73777F;
  --sec: #545F71; --onp: #fff; --ok: #286C2A; --err: #BA1A1A; --warn: #7C5800;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: var(--fs); }
body { font-family: Roboto, system-ui, sans-serif; background: var(--bg); color: var(--on); min-height: 100dvh; user-select: none; }
.ms { font-family: 'Material Symbols Outlined'; font-size: 24px; line-height: 1; font-style: normal; display: inline-block; vertical-align: middle; }
#bg { position: fixed; inset: 0; z-index: 0; opacity: 0.45; pointer-events: none; width: 100%; height: 100%; }
#main { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 16px 120px; }

/* Header & Top Bar */
.top { display: flex; align-items: center; gap: 10px; padding: 14px 0; position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #1E5AA8, #00AFAE); display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #fff; flex: none; }
.top h1 { font-size: 1.25rem; font-weight: 500; flex: 1; }
.top small { display: block; font-size: 0.72rem; color: var(--out); font-weight: 400; }
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--on); display: grid; place-items: center; cursor: pointer; flex: none; }
.ib:hover { background: #8883; }

/* App Cards */
.card { background: var(--card); border-radius: 24px; padding: 14px; margin-bottom: 10px; border: 1px solid #8882; position: relative; }
.banner { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #0d3a6d, #0a5959); color: #fff; border-radius: 24px; padding: 14px; margin-bottom: 12px; }
.banner .s { font-size: 0.78rem; opacity: 0.75; }
.grid { display: grid; gap: 10px; }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }

.swipe-box { position: relative; overflow: visible; border-radius: 24px; margin-bottom: 10px; }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-weight: 700; font-size: 0.9rem; border-radius: 24px; z-index: 0; }
.swipe-bg.left { background: var(--err); color: #000; justify-content: flex-end; }
.swipe-bg.right { background: var(--primary); color: var(--onp); justify-content: flex-start; }
.swipe-front { position: relative; background: var(--card); border-radius: 24px; padding: 14px; border: 1px solid #8882; transition: transform 0.15s ease-out; touch-action: pan-y; z-index: 1; }

.app { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; flex: none; font-weight: 700; font-size: 1.4rem; overflow: hidden; position: relative; }
.ico img { width: 100%; height: 100%; padding: 4px; object-fit: contain; object-position: center; display: block; }
.n { font-weight: 500; display: flex; gap: 4px; align-items: center; }
.mono { font: 0.72rem ui-monospace, monospace; color: var(--out); word-break: break-all; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; padding: 3px 8px; border-radius: 8px; background: var(--sv); margin: 4px 4px 0 0; }
.chip.ok { background: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
.chip.bad { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--err); }
.chip.p { background: var(--pc); color: var(--primary); }
.chip.warn { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn); }

/* Buttons & Menu */
.pill { border: 0; border-radius: 20px; padding: 8px 16px; background: var(--primary); color: var(--onp); font: 500 0.88rem Roboto; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.t { background: none; color: var(--primary); }
.pill.o { background: none; color: var(--primary); border: 1px solid var(--out); }
.pill.d { background: var(--err); color: #000; }
.pill:disabled { opacity: 0.4; cursor: default; }

.menu-wrap { position: relative; display: inline-block; }
.menu-pop { position: absolute; right: 0; top: 100%; background: var(--card-high); border: 1px solid #8884; border-radius: 16px; padding: 6px; min-width: 220px; z-index: 25; box-shadow: 0 8px 24px #0008; display: none; flex-direction: column; gap: 2px; }
.menu-pop.on { display: flex; }
.menu-item { padding: 9px 12px; border-radius: 10px; font-size: 0.82rem; color: var(--on); text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 0; background: none; width: 100%; text-align: left; }
.menu-item:hover { background: #8882; }
.menu-item .ms { font-size: 18px; color: var(--primary); }

/* Bottom Dock */
#dock { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 8; display: flex; gap: 4px; background: var(--card); border: 1px solid #8883; border-radius: 32px; padding: 6px; box-shadow: 0 6px 24px #0007; }
.bb { display: flex; flex-direction: column; align-items: center; min-width: 68px; padding: 8px 8px 6px; border-radius: 24px; border: 0; background: none; color: var(--on); font: 500 0.7rem Roboto; cursor: pointer; gap: 2px; }
.bb.hl { background: var(--pc); color: var(--primary); }
@media (min-width: 900px) {
  #dock { left: 14px; top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; border-radius: 32px; }
  #main { margin-left: max(104px, calc(50vw - 480px + 52px)); }
}

/* Forms & Dialogs */
input[type=text], input[type=password], select { width: 100%; padding: 12px 16px; border-radius: 24px; border: 1px solid var(--out); background: transparent; color: var(--on); font: 1rem Roboto; outline: 0; }
input:focus, select:focus { border-color: var(--primary); }
.lbl { font-size: 0.75rem; color: var(--sec); margin: 10px 4px 4px; }
.sw { position: relative; width: 52px; height: 30px; border-radius: 15px; background: var(--sv); border: 2px solid var(--out); flex: none; cursor: pointer; transition: 0.2s; }
.sw::after { content: ""; position: absolute; top: 5px; left: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--out); transition: 0.2s; }
.sw.on { background: var(--primary); border-color: var(--primary); }
.sw.on::after { left: 25px; top: 3px; width: 24px; height: 24px; background: var(--onp); }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.row .g { flex: 1; min-width: 0; }
.row .d { font-size: 0.78rem; color: var(--out); margin-top: 2px; }

.dlg-bg { position: fixed; inset: 0; background: #0009; z-index: 30; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.dlg-bg.on { display: flex; }
.dlg { background: var(--card); width: min(600px, 100%); max-height: 90vh; overflow-y: auto; border-radius: 28px; padding: 22px; border: 1px solid #8883; box-shadow: 0 10px 30px #000a; }
.dlg h2 { font-size: 1.25rem; font-weight: 500; margin-bottom: 6px; }
.dlg p { font-size: 0.85rem; color: var(--sec); margin-bottom: 12px; }

.toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: #e3e2e6; color: #1a1c1e; padding: 10px 20px; border-radius: 14px; font-size: 0.85rem; z-index: 60; opacity: 0; transition: 0.25s; pointer-events: none; max-width: 92vw; box-shadow: 0 4px 14px #0006; }
.toast.on { opacity: 1; } .toast.bad { background: #ffb4ab; color: #000; }
.fab { position: fixed; right: 16px; bottom: 96px; z-index: 9; box-shadow: 0 6px 20px #0008; padding: 14px 22px; }
@media (min-width: 900px) { .fab { bottom: 24px; right: 24px; } }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); animation: p 1.6s infinite; flex: none; }
@keyframes p { 50% { opacity: 0.3; } }
.wavy-bar { height: 12px; border-radius: 6px; background: var(--sv); overflow: hidden; margin: 12px 0; }
.wavy-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1E5AA8, #00AFAE, #A4C9FF); background-size: 200%; animation: sh 1.5s linear infinite; transition: width 0.3s; }
@keyframes sh { to { background-position: -200%; } }
#term { background: #0a0b0c; color: #e3e2e6; border-radius: 16px; padding: 12px; font: 0.75rem/1.5 ui-monospace, monospace; max-height: 320px; overflow-y: auto; margin-top: 10px; }
.INFO { color: #8ab4f8; } .SUCCESS { color: #90D889; } .ERROR { color: #FFB4AB; }

.status-card { background: var(--card-high); border: 1px solid #8882; border-radius: 20px; padding: 14px; margin: 10px 0; }
.build-collapsible { padding: 0; overflow: hidden; }
.build-collapsible > summary { list-style: none; cursor: pointer; padding: 14px; }
.build-collapsible > summary::-webkit-details-marker { display: none; }
.build-collapsible[open] > summary { border-bottom: 1px solid #8882; }
.build-collapsible .status-title { width: 100%; }
.expand-icon { transition: transform .18s ease; color: var(--out); flex: none; }
.build-collapsible[open] .expand-icon { transform: rotate(180deg); }
.collapsible-content { padding: 0 14px 14px; }
.status-title { display:flex; align-items:center; gap:8px; font-weight:500; }
.status-icon { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--sv); color:var(--on); flex:none; }
.status-icon.ok { background:color-mix(in srgb,var(--ok) 25%,transparent); color:var(--ok); }
.status-icon.warn { background:color-mix(in srgb,var(--warn) 25%,transparent); color:var(--warn); }
.status-icon.bad { background:color-mix(in srgb,var(--err) 22%,transparent); color:var(--err); }
.step-list { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
.step { display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--out); }
.step.current { color:var(--on); font-weight:500; }
.step.done { color:var(--ok); }
.step-dot { width:8px; height:8px; border-radius:50%; background:var(--sv); flex:none; }
.step.current .step-dot { background:var(--primary); box-shadow:0 0 0 4px var(--pc); }
.step.done .step-dot { background:var(--ok); }
.action-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.app-hero { display:flex; gap:12px; align-items:center; }
.app-hero .hero-copy { flex:1; min-width:0; }
.hero-action { width:100%; justify-content:center; margin-top:8px; }
@media (min-width:700px) { .hero-action { width:auto; margin-top:0; } }
.file-drop { border:1px dashed var(--out); border-radius:20px; padding:22px 16px; text-align:center; background:color-mix(in srgb,var(--card-high) 70%,transparent); }
.file-drop:hover { border-color:var(--primary); }

.dashboard-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
.stat { background:var(--card); border:1px solid #8882; border-radius:18px; padding:10px 8px; text-align:center; }
.stat b { display:block; font-size:1.05rem; font-weight:500; }
.stat span { display:block; font-size:.68rem; color:var(--out); margin-top:2px; }
.patch-tools { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.patch-tools input { flex:1; min-width:0; }
@media (max-width:520px) {
  .dashboard-stats { gap:6px; }
  .stat { padding:9px 5px; }
  .patch-tools { align-items:stretch; flex-direction:column; }
  .patch-tools .pill { justify-content:center; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="main"></div>

<button class="pill fab" id="fab" data-a="save" style="display:none">
  <i class="ms">save</i> Save changes
</button>

<div id="dock">
  <button class="bb" data-nav="home" data-a="go" data-h=""><i class="ms">home</i>Apps</button>
  <button class="bb" data-nav="sources" data-a="go" data-h="sources"><i class="ms">source</i>Sources</button>
  <button class="bb" data-nav="builds" data-a="go" data-h="builds"><i class="ms">construction</i>Builds</button>
  <button class="bb" data-nav="settings" data-a="go" data-h="settings"><i class="ms">settings</i>Settings</button>
</div>

<div class="dlg-bg" id="dbg"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const b64 = s => {
  try {
    const bin = atob(s.replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  } catch(e) { return '{}'; }
};
const u64 = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
};

const LS = 'patch-manager-cfg';
const PK_REGISTRY = {
  'com.google.android.youtube': ['YouTube', '#e53935,#b71c1c'],
  'com.google.android.apps.youtube.music': ['YouTube Music', '#ff7043,#d84315'],
  'com.reddit.frontpage': ['Reddit', '#ff8f00,#e65100'],
  'com.twitter.android': ['Twitter / X', '#1da1f2,#0d8ddb'],
  'tv.twitch.android.app': ['Twitch', '#9146ff,#6441a5'],
  'com.zhiliaoapp.musically': ['TikTok', '#fe2c55,#25f4ee'],
  'com.ss.android.ugc.trill': ['TikTok', '#fe2c55,#25f4ee'],
  'com.facebook.katana': ['Facebook', '#1877f2,#0d5ec4'],
  'com.facebook.orca': ['Messenger', '#0084ff,#0060cc'],
  'com.facebook.lite': ['Facebook Lite', '#1877f2,#0d5ec4'],
  'com.instagram.android': ['Instagram', '#e1306c,#c13584'],
  'com.instagram.barcelona': ['Threads', '#000000,#333333']
};

function getAppMeta(pkg) {
  if (PK_REGISTRY[pkg]) {
    return { name: PK_REGISTRY[pkg][0], color: PK_REGISTRY[pkg][1] };
  }
  const parts = (pkg || '').split('.');
  const raw = parts[parts.length - 1] || pkg || 'app';
  const name = raw.charAt(0).toUpperCase() + raw.slice(1);
  return { name, color: '#1E5AA8,#00AFAE' };
}

const ICON_DOMAINS = {
  'com.google.android.youtube': 'youtube.com',
  'com.google.android.apps.youtube.music': 'music.youtube.com',
  'com.duolingo': 'duolingo.com',
  'Duolingo': 'duolingo.com',
  'com.adguard.android': 'adguard.com',
  'me.mycake': 'cakecorp.com',
  'com.bunpoapp': 'bunpo.app',
  'com.facebook.katana': 'facebook.com',
  'com.facebook.orca': 'messenger.com',
  'com.instagram.android': 'instagram.com',
  'com.instagram.barcelona': 'threads.net',
  'com.reddit.frontpage': 'reddit.com',
  'com.twitter.android': 'x.com',
  'tv.twitch.android.app': 'twitch.tv',
  'com.zhiliaoapp.musically': 'tiktok.com',
  'com.ss.android.ugc.trill': 'tiktok.com'
};
const APP_NAME_DOMAINS = {
  'Facebook':'facebook.com','Messenger':'messenger.com','YouTube':'youtube.com','YouTube Music':'music.youtube.com',
  'Duolingo':'duolingo.com','AdGuard':'adguard.com','Cake':'cakecorp.com','Bunpo':'bunpo.app','Reddit':'reddit.com','Twitter / X':'x.com','Twitch':'twitch.tv','TikTok':'tiktok.com',
  'Instagram':'instagram.com','Threads':'threads.net','GitHub':'github.com','SoundCloud':'soundcloud.com',
  'Sofascore':'sofascore.com','CamScanner':'camscanner.com','Prime Video':'primevideo.com','Proton VPN':'protonvpn.com'
};
function officialIconUrl(a) {
  const pkg = String(a && a.package || '');
  const name = ttl(a);
  const domain = ICON_DOMAINS[pkg] || APP_NAME_DOMAINS[name] || '';
  return domain ? 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=128' : '';
}
function appIconUrl(a) {
  const info = (a && S.cats[a.id] && S.cats[a.id].info) || {};
  return info.icon_url || (a && a.icon_url) || officialIconUrl(a);
}
function appIconHtml(a) {
  const label = esc((ttl(a)[0] || 'A').toUpperCase());
  const url = appIconUrl(a);
  const bg = 'background:linear-gradient(135deg, ' + hue(a) + ')';
  if (!url) return '<div class="ico" style="' + bg + '">' + label + '</div>';
  return '<div class="ico" style="' + bg + '"><img src="' + esc(url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\';"><span style="display:none;width:100%;height:100%;place-items:center">' + label + '</span></div>';
}

const ARCH = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'];
const EXT = /\.(apk|apkm|apks|xapk|axapk)$/i;

let S = {
  owner: '', repo: '', branch: 'main', token: '', wf: 'build.yml',
  mode: 'system', black: false, accent: '#A4C9FF', scale: 100,
  config: { 
    settings: { 
      default_arch: 'arm64-v8a', 
      auto_prune: true, 
      keep_releases: 3, 
      trigger_policy: 'on_new_patch', 
      check_interval_hours: 6,
      discord_webhook: ''
    }, 
    sources: [], apps: [], hidden_apps: [] 
  },
  cats: {}, rels: [], runs: [], upstreamTags: {}, dirty: false,
  onlySel: false, live: null, connected: false, localApks: {}, sourceSearch: '', patchSearch: {}
};

if (/github\.io$/.test(location.hostname)) {
  S.owner = location.hostname.split('.')[0];
  S.repo = location.pathname.split('/')[1] || '';
}
try {
  const cached = JSON.parse(localStorage.getItem(LS) || localStorage.getItem('patchmanager') || '{}');
  Object.assign(S, cached);
} catch(e){}

const persist = () => {
  const { owner, repo, branch, token, wf, mode, black, accent, scale } = S;
  localStorage.setItem(LS, JSON.stringify({ owner, repo, branch, token, wf, mode, black, accent, scale }));
};
const sw = (on, attrs) => `<div class="sw ${on?'on':''}" ${attrs}></div>`;
const A = {}, C = {};

function toast(t, bad) {
  const e = $('#toast');
  e.textContent = t;
  e.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(e.t);
  e.t = setTimeout(() => e.className = 'toast', 3200);
}

async function gh(path, o={}, raw) {
  const r = await fetch(raw ? path : 'https://api.github.com/repos/' + S.owner + '/' + S.repo + path, {
    ...o,
    headers: {
      Authorization: 'Bearer ' + S.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(o.body ? {'Content-Type': 'application/json'} : {}),
      ...(o.headers || {})
    }
  });
  if (!r.ok) {
    let m = '';
    try { m = (await r.json()).message; } catch(e){}
    const er = new Error('GitHub ' + r.status + (m ? ': ' + m : ''));
    er.status = r.status;
    throw er;
  }
  return r.status == 204 ? null : r.json();
}

function apkReadiness(a, info) {
  info = info || {};
  const acquisition = info.apk_acquisition || {};
  const stock = info.stock_apk || null;
  const target = acquisition.target_version || info.recommended_version || a.version || '';
  const stockExact = !!(stock && stock.version_name && target && stock.version_name === target);
  const stockRelease = stockRel(a.id);
  const hasStockAsset = !!(stockRelease && (stockRelease.assets || []).some(x => EXT.test(x.name)));
  if (acquisition.status === 'manual_required') return {state:'manual', label:'Manual APK required', detail: target ? 'Exact ' + target + ' was not acquired automatically.' : 'Automatic APK acquisition failed.', target:target};
  if (stockExact) return {state:'ready', label:'Exact APK verified', detail: target + ' · ' + ((stock.architectures || []).join(', ') || 'architecture recorded'), target:target};
  if (hasStockAsset && !stock) return {state:'unknown', label:'Stock APK present', detail:'Release contains an APK, but its metadata has not been recorded yet.', target:target};
  if (acquisition.status === 'downloaded' && stock) return {state:'warning', label:'APK metadata needs refresh', detail:'Recorded ' + (stock.version_name || 'unknown') + ' · target ' + (target || 'Auto'), target:target};
  return {state:'unknown', label:'APK not checked', detail: target ? 'Target version: ' + target : 'No target version selected.', target:target};
}


function targetVersionFor(a, info) {
  info = info || {};
  const acq = info.apk_acquisition || {};
  return acq.target_version || info.recommended_version || a.version || 'Auto';
}

function latestPatchedAsset(a) {
  const rel = relsFor(a.id)[0];
  if (!rel) return null;
  const asset = (rel.assets || []).find(x => /\.apk$/i.test(x.name));
  return asset ? { ...asset, release: rel } : null;
}

function renderBuildTimeline(stage, status) {
  const order = [
    ['patch_source', 'Patch source'],
    ['apk_acquisition', 'Stock APK'],
    ['patching', 'Applying patches'],
    ['output_validation', 'Verify patched APK'],
    ['publishing', 'Publishing'],
    ['completed', 'Completed']
  ];
  const idx = Math.max(0, order.findIndex(x => x[0] === stage));
  return '<div class="step-list">' + order.map((x, i) => {
    const done = status === 'success' ? i < order.length - 1 : (status === 'running' && i < idx);
    const current = status === 'running' && i === idx;
    return '<div class="step '+(done?'done ':'')+(current?'current':'')+'"><span class="step-dot"></span><span>'+(done?'✓ ':'')+esc(x[1])+'</span></div>';

async function connect(quiet) {
  if (!S.owner || !S.repo || !S.token) return dlgConnect();
  try {
    try {
      const d = await gh('/contents/config.json?ref=' + encodeURIComponent(S.branch));
      S.sha = d.sha;
      S.config = JSON.parse(b64(d.content));
    } catch(e) {
      if (e.status != 404) throw e;
      S.sha = '';
      S.config = { 
        settings: { default_arch: 'arm64-v8a', auto_prune: true, keep_releases: 3, trigger_policy: 'on_new_patch', check_interval_hours: 6, discord_webhook: '' }, 
        sources: [], apps: [], hidden_apps: [] 
      };
    }
    if (!S.config.settings) S.config.settings = { default_arch: 'arm64-v8a', auto_prune: true, keep_releases: 3, trigger_policy: 'on_new_patch', check_interval_hours: 6, discord_webhook: '' };
    if (!Array.isArray(S.config.apps)) S.config.apps = [];
    if (!Array.isArray(S.config.sources)) S.config.sources = [];
    if (!Array.isArray(S.config.hidden_apps)) S.config.hidden_apps = [];

    S.connected = true; S.dirty = false; persist(); closeDlg(); render();
    await Promise.all([loadLocalCatalogs(), loadRels(), loadRuns(), checkLocalApks(), checkUpstreamUpdates()]);
    render();
    if (!quiet) toast('Connected ✔');
  } catch(e) {
    S.connected = false;
    toast(e.message, 1);
    if (!quiet) dlgConnect();
    render();
  }
}

async function checkLocalApks() {
  try {
    const files = await gh('/contents/apks?ref=' + encodeURIComponent(S.branch));
    S.localApks = {};
    if (Array.isArray(files)) {
      files.forEach(f => {
        (S.config.apps || []).forEach(a => {
          if (f.name.startsWith(a.id) || f.name.startsWith(a.package)) {
            S.localApks[a.id] = S.localApks[a.id] || [];
            S.localApks[a.id].push(f.name);
          }
        });
      });
    }
  } catch(e) { S.localApks = {}; }
}

async function loadLocalCatalogs() {
  for (const a of (S.config.apps || [])) {
    try {
      let patches = null, info = null;
      try {
        const pRes = await fetch('catalog/' + encodeURIComponent(a.id) + '.json?t=' + Date.now());
        if (pRes.ok) patches = await pRes.json();
        const iRes = await fetch('catalog/' + encodeURIComponent(a.id) + '.info.json?t=' + Date.now());
        if (iRes.ok) info = await iRes.json();
      } catch(e){}

      if (!patches && S.token) {
        try {
          const d = await gh('/contents/docs/catalog/' + encodeURIComponent(a.id) + '.json?ref=' + encodeURIComponent(S.branch));
          patches = JSON.parse(b64(d.content));
          try {
            const idoc = await gh('/contents/docs/catalog/' + encodeURIComponent(a.id) + '.info.json?ref=' + encodeURIComponent(S.branch));
            info = JSON.parse(b64(idoc.content));
          } catch(e){}
        } catch(e){}
      }

      if (patches) {
        S.cats[a.id] = { patches, info };
      }
    } catch(e) {
      console.warn('Catalog load error for', a.id, e);
    }
  }
}

async function checkUpstreamUpdates() {
  for (const a of (S.config.apps || [])) {
    const repos = Array.isArray(a.patch_sources) && a.patch_sources.length
      ? a.patch_sources
      : (a.patches_repo ? [a.patches_repo] : []);
    for (const repo of repos) {
      try {
        const rels = await gh(`https://api.github.com/repos/${repo}/releases?per_page=1`, {}, 1);
        if (Array.isArray(rels) && rels.length > 0) {
          S.upstreamTags[repo] = rels[0].tag_name || rels[0].tagName;
        }
      } catch(e){}
    }
  }
}

let touchState = { startX:0, startY:0, el:null, id:null, swiping:false };

function initGestures() {
  document.querySelectorAll('.swipe-front').forEach(card => {
    card.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchState = { startX: t.clientX, startY: t.clientY, el: card, id: card.dataset.id, swiping: false };
    }, { passive: true });

    card.addEventListener('touchmove', e => {
      if (!touchState.el) return;
      const t = e.touches[0];
      const diffX = t.clientX - touchState.startX;
      const diffY = t.clientY - touchState.startY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 12) {
        touchState.swiping = true;
        touchState.el.style.transform = `translateX(${diffX}px)`;
        const bg = touchState.el.previousElementSibling;
        if (diffX > 0) {
          bg.className = 'swipe-bg right';
          bg.innerHTML = '<span class="row"><i class="ms">tune</i> View Patches</span>';
        } else {
          bg.className = 'swipe-bg left';
          bg.innerHTML = '<span class="row">Hide App <i class="ms">visibility_off</i></span>';
        }
      }
    }, { passive: true });

    card.addEventListener('touchend', e => {
      if (!touchState.swiping || !touchState.el) return;
      const t = e.changedTouches[0];
      const diffX = t.clientX - touchState.startX;
      touchState.el.style.transform = '';

      if (diffX > 85) {
        location.hash = '#/app/' + encodeURIComponent(touchState.id);
      } else if (diffX < -85) {
        hideApp(touchState.id);
      }
      touchState.swiping = false;
    });
  });
}

async function uploadReleaseAsset(release, file, onProgress) {
  const base = String(release.upload_url || '').replace(/\\{\\?name,label\\}$/, '');
  if (!base) throw new Error('GitHub release upload URL is unavailable.');
  return await new Promise((resolve,reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', base + '?name=' + encodeURIComponent(file.name), true);
    xhr.setRequestHeader('Authorization','Bearer ' + S.token);
    xhr.setRequestHeader('Accept','application/vnd.github+json');
    xhr.setRequestHeader('X-GitHub-Api-Version','2022-11-28');
    xhr.setRequestHeader('Content-Type','application/vnd.android.package-archive');
    xhr.upload.onprogress = e => { if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(new Error('Invalid GitHub upload response.')); }
      } else {
        let m=''; try { m=JSON.parse(xhr.responseText).message || ''; } catch(e){}
        reject(new Error('Upload failed (' + xhr.status + ')' + (m ? ': ' + m : '')));
      }
    };
    xhr.onerror = () => reject(new Error('Network error during APK upload.'));
    xhr.send(file);
  });
}

  const p = location.hash.replace(/^#\/?/, '').split('/');
  return { v: p[0] || 'home', id: decodeURIComponent(p[1] || '') };

function configuredSourceForRepo(repo) {
  return (S.config.sources || []).find(x => x.repo === repo);
}

function appByPackage(pkg) {
  const key = String(pkg || '').trim().toLowerCase();
  return (S.config.apps || []).find(x =>
    String(x.package || '').trim().toLowerCase() === key ||
    String(x.android_package || '').trim().toLowerCase() === key
  );
}

function normalizeAndroidPackage(value) {
  return String(value || '').trim().replace(/^["']|["']$/g, '');
}

function extractPlayPackage(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  try {
    const u = new URL(raw);
    if (/(.|^)play\.google\.com$/i.test(u.hostname)) {
      return normalizeAndroidPackage(u.searchParams.get('id') || '');
    }
  } catch(e) {}
  return /^[a-z][a-z0-9_]*(\.[a-z0-9_]+)+$/i.test(raw) ? raw : '';
}

function normalizeLookupText(value) {
  return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function matchConfiguredPatchApps(name, androidPackage) {
  const wantedName = normalizeLookupText(name);
  const wantedPkg = normalizeLookupText(androidPackage);
  const pkgLeaf = wantedPkg.split('.').pop();
  const hits = [];

  for (const src of (S.config.sources || [])) {
    if (src.enabled === false) continue;

    for (const item of (src.apps || [])) {
      const patchPackage = typeof item === 'string' ? item : (item.package || '');
      const appName = typeof item === 'string'
        ? getAppMeta(patchPackage).name
        : (item.name || getAppMeta(patchPackage).name);

      const pn = normalizeLookupText(patchPackage);
      const an = normalizeLookupText(appName);
      let score = 0;

      if (wantedName && an === wantedName) score += 100;
      else if (wantedName && (an.includes(wantedName) || wantedName.includes(an))) score += 50;

      if (wantedPkg && pn === wantedPkg) score += 120;
      if (pkgLeaf && (pn === pkgLeaf || an === pkgLeaf)) score += 25;

      if (score > 0) {
        hits.push({ repo: src.repo, package: patchPackage, name: appName, source: src, score });
      }
    }
  }

  hits.sort((a,b) => b.score - a.score);
  const unique = new Map();
  hits.forEach(x => {
    const key = x.repo + '|' + x.package;
    if (!unique.has(key)) unique.set(key, x);
  });
  return Array.from(unique.values());
}

function appIdFromName(name, pkg) {
  const seed = String(name || pkg || 'app').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const base = seed || 'app';
  let id = base, n = 2;
  while ((S.config.apps || []).some(a => a.id === id)) id = base + '-' + n++;
  return id;
}

function sourceAppId(pkg) {
  const parts = String(pkg || '').split('.').filter(Boolean);
  let base = (parts[parts.length - 1] || 'app').toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
  if (!base) base = 'app';
  let id = base, n = 2;
  while ((S.config.apps || []).some(a => a.id === id && a.package !== pkg)) id = base + '-' + n++;
  return id;
}

function addDiscoveredApp(pkg, repo) {
  const repos = Array.isArray(repo) ? repo : [repo];
  const sources = repos.map(configuredSourceForRepo).filter(Boolean);
  if (!sources.length) return toast('Source is not configured. Inspect and add it first.', 1);
  S.config.apps = Array.isArray(S.config.apps) ? S.config.apps : [];
  let a = appByPackage(pkg);

  if (!a) {
    const id = sourceAppId(pkg);
    const defArch = (S.config.settings && S.config.settings.default_arch) || 'arm64-v8a';
    a = {
      id, package: pkg, patches_repo: sources[0].repo,
      patch_sources: sources.map(x => x.repo),
      prerelease: sources.some(x => x.prerelease === true),
      arch: defArch, apk_arch: 'auto',
      version: '', force: false, auto_patch: true, enable: [], disable: [], options: {}
    };
    S.config.apps.push(a);
  } else {
    a.patch_sources = Array.isArray(a.patch_sources) ? a.patch_sources : (a.patches_repo ? [a.patches_repo] : []);
    for (const x of sources) if (!a.patch_sources.includes(x.repo)) a.patch_sources.push(x.repo);
    if (!a.patches_repo) a.patches_repo = sources[0].repo;
  }

  dirty();
  render();
  toast('App added to Apps with compatible patch sources. Save changes.');
}

function dashboardSummary() {
  const apps = (S.config.apps || []).filter(a => !(S.config.hidden_apps || []).includes(a.id));
  let ready = 0, attention = 0, updates = 0;
  apps.forEach(a => {
    const info = (S.cats[a.id] && S.cats[a.id].info) || {};
    const st = apkReadiness(a, info);
    if (st.state === 'ready') ready++; else attention++;
    const rel = relsFor(a.id)[0];
    const patchTag = rel ? rel.tag_name.replace(a.id + '-', '') : '';
    const sourceTag = S.upstreamTags[a.patches_repo] || info.patch_tag || '';
    if (patchTag && sourceTag && patchTag !== sourceTag) updates++;
  });
  return { total: apps.length, ready, attention, updates };
}

  const steps = [

    ['Verify patched APK', L.pct >= 90],

    } else if (L.ok) {

async function dispatchBuild(appId, force=true) {
  if (S.dirty) { toast('Save your changes first!', 1); return; }
  if (S.live && !S.live.done) { toast('A build is already being tracked.', 1); return; }

  const L = S.live = { lines: [], pct: 5, stage: 'Dispatching', done: false, ok: false, app: appId || '' };
  location.hash = '#/builds';

  try {
    // Ask GitHub to return the exact workflow_run_id created by this dispatch.
    // This avoids accidentally attaching the UI to another recent/cancelled run.
    const dispatch = await gh(`/actions/workflows/${S.wf}/dispatches`, {
      method: 'POST',
      body: JSON.stringify({
        ref: S.branch,
        inputs: { app: appId || '', force: !!force }
      })
    });

    L.lines.push(['INFO', 'Workflow dispatch initiated...']);
    paintLive();

    let runId = dispatch && dispatch.workflow_run_id ? dispatch.workflow_run_id : null;
    const seen = new Set();

    for (let k = 0; k < 250; k++) {
      await new Promise(r => setTimeout(r, 4000));

      // Fallback for GitHub installations that return 204 instead of run details.
      if (!runId) {
        const rs = (await gh(`/actions/runs?event=workflow_dispatch&branch=${encodeURIComponent(S.branch)}&per_page=20`)).workflow_runs || [];
        const candidates = rs
          .filter(r => r.head_branch === S.branch && Date.parse(r.created_at) >= t0)
          .sort((a, b) => b.id - a.id);
        if (candidates.length) runId = candidates[0].id;
      }
      if (!runId) continue;

      const run = await gh(`/actions/runs/${runId}`);
      if (!run || !run.id) continue;

      L.run = run.id;
      L.url = run.html_url;

      const st = (await gh(`/actions/runs/${run.id}/jobs`)).jobs.flatMap(j => j.steps || []);
      st.forEach(s => {
        const key = s.name + s.status + s.conclusion;
        if (s.status !== 'queued' && !seen.has(key)) {
          seen.add(key);
          L.lines.push([
            s.status === 'completed'
              ? (s.conclusion === 'success' ? 'SUCCESS' : 'ERROR')
              : 'INFO',
            s.name
          ]);
        }
      });

      // Progress is based on the five actual build phases, not GitHub's
      // setup/cleanup steps, so "15%" no longer looks like a frozen build.
      const phaseNames = ['Load Patches', 'Read APK', 'Execute Patches', 'Write Output', 'Sign APK'];
      const completed = phaseNames.filter(name =>
        st.some(s => s.name === name && s.status === 'completed' && s.conclusion === 'success')
      ).length;
      const workflowCompleted = st.filter(s => s.status === 'completed').length;
      const workflowTotal = st.length || 1;
      L.pct = run.status === 'completed'
        ? (run.conclusion === 'success' ? 100 : Math.max(10, Math.round((completed / phaseNames.length) * 100)))
        : Math.max(5, Math.round(Math.min(95, (workflowCompleted / workflowTotal) * 100)));

      L.stage = run.status === 'completed'
        ? (run.conclusion === 'success' ? 'Completed! 🎉' : 'Build Failed')
        : (run.status === 'in_progress' ? 'Build in progress' : run.status.replace('_', ' '));
      paintLive();

      if (run.status === 'completed') {
        L.done = true;
        L.ok = run.conclusion === 'success';
        await Promise.all([loadLocalCatalogs(), loadRels(), loadRuns(), checkLocalApks(), checkUpstreamUpdates()]);
        const builtAsset = latestPatchedAsset(appId ? app(appId) : (L.app ? app(L.app) : null));
        if (builtAsset) {
          L.downloadUrl = builtAsset.browser_download_url;
          L.releaseUrl = builtAsset.release.html_url;
          L.releaseTag = builtAsset.release.tag_name;
        } else {
          const candidate = S.rels.find(r => appId && r.tag_name.startsWith(appId + '-'));
          const fallbackAsset = candidate && (candidate.assets || []).find(x => /\.apk$/i.test(x.name));
          if (fallbackAsset) {
            L.downloadUrl = fallbackAsset.browser_download_url;
            L.releaseUrl = candidate.html_url;
            L.releaseTag = candidate.tag_name;
          }
        }
        paintLive();
        return;
      }
    }

    L.done = true;
    L.ok = false;
    L.stage = 'Build monitor timed out';
    L.lines.push(['ERROR', 'GitHub is still running or the run could not be located after 1000 seconds.']);
    paintLive();
  } catch(e) {
    L.done = true; L.stage = 'Dispatch Failed';
    L.lines.push(['ERROR', e.message]);
    paintLive();
  }
}


function systemStatus() {
  const sources = (S.config.sources || []).filter(x => x.enabled !== false);
  const apps = (S.config.apps || []).filter(a => !(S.config.hidden_apps || []).includes(a.id));
  const latestRun = S.runs && S.runs.length ? S.runs[0] : null;
  const readyApps = apps.filter(a => {
    const info = (S.cats[a.id] && S.cats[a.id].info) || {};
    return apkReadiness(a, info).state === 'ready';
  }).length;
  const failedBuild = latestRun && latestRun.conclusion === 'failure';
  const buildState = !latestRun ? 'unknown' : latestRun.status === 'in_progress' ? 'running' : latestRun.conclusion === 'success' ? 'ok' : failedBuild ? 'bad' : 'warn';
  return {
    repo: S.connected ? 'ok' : 'bad',
    sources: sources.length ? 'ok' : 'warn',
    apps: apps.length ? 'ok' : 'warn',
    apks: apps.length && readyApps === apps.length ? 'ok' : readyApps ? 'warn' : 'bad',
    build: buildState,
    signing: 'unknown',
    sourceCount: sources.length,
    appCount: apps.length,
    readyApps,
    latestRun
  };
}

function statusRow(label, state, detail) {
  const icons = { ok:'check_circle', warn:'warning', bad:'error', running:'sync', unknown:'help' };
  const labels = { ok:'Ready', warn:'Attention', bad:'Problem', running:'Running', unknown:'Check required' };
  const cls = state === 'ok' ? 'ok' : state === 'bad' ? 'bad' : state === 'warn' || state === 'running' ? 'warn' : '';
  return '<div class="row"><span class="status-icon '+cls+'" style="width:30px;height:30px"><i class="ms" style="font-size:18px">'+icons[state]+'</i></span><div class="g"><b>'+esc(label)+'</b><div class="d">'+esc(detail)+'</div></div><span class="chip '+cls+'">'+labels[state]+'</span></div>';
}

function inspectAppEntry() {
  const name = (($('n_app_name') || {}).value || '').trim();
  const raw = (($('n_app_play') || {}).value || '').trim();
  const androidPackage = extractPlayPackage(raw);
  const matches = matchConfiguredPatchApps(name, androidPackage);
  const result = $('#app_inspect_result');

  if (!name && !androidPackage) return toast('Enter an app name, Play Store URL, or package ID.', 1);
  if (!result) return;

  if (!matches.length) {
    result.innerHTML = '<div class="warnb">No matching app was found in the currently configured patch sources. Add/inspect the source first, or use the Sources page to discover compatible apps.</div>';
    newAppInspection = null;
    return;
  }

  const best = matches[0];
  const existing = androidPackage ? appByPackage(androidPackage) : null;
  const exactPackage = androidPackage || (existing && (existing.android_package || existing.package)) || '';

  newAppInspection = {
    name: name || best.name,
    androidPackage: exactPackage,
    matches
  };

  result.innerHTML =
    '<div class="card" style="background:var(--card-high);margin:8px 0">' +
      '<b>' + esc(newAppInspection.name) + '</b>' +
      '<div class="d" style="margin-top:4px">' +
        (exactPackage ? 'Android package: <span class="mono">' + esc(exactPackage) + '</span>' : 'Android package: <b>needs confirmation</b>') +
      '</div>' +
      '<div class="d" style="margin-top:4px">Matching patch sources: ' + matches.length + '</div>' +
    '</div>' +
    matches.slice(0, 6).map((m, i) =>
      '<div class="row" style="padding:7px 0">' +
        '<div class="g"><b>' + (i + 1) + '. ' + esc(m.name || m.package) + '</b><div class="d">' + esc(m.repo) + ' · patch target ' + esc(m.package) + '</div></div>' +
        '<span class="chip ' + (i === 0 ? 'p' : '') + '">' + (i === 0 ? 'Selected' : 'Compatible') + '</span>' +
      '</div>'
    ).join('') +
    (!exactPackage ? '<div class="warnb" style="margin-top:8px">Enter the Google Play URL or exact Android package ID to continue. This prevents the wrong APK from being selected.</div>' : '') +

function doAddApp() {
  if (!newAppInspection || !newAppInspection.androidPackage) return toast('Confirm the exact Android package first.', 1);

  const selected = newAppInspection.matches[0];
  const repos = Array.from(new Set(newAppInspection.matches.map(x => x.repo)));
  const existing = appByPackage(newAppInspection.androidPackage);
  S.config.apps = Array.isArray(S.config.apps) ? S.config.apps : [];

  if (existing) {
    existing.name = existing.name || newAppInspection.name;
    existing.android_package = existing.android_package || newAppInspection.androidPackage;
    existing.patch_package = existing.patch_package || selected.package;
    existing.patch_sources = Array.isArray(existing.patch_sources) ? existing.patch_sources : (existing.patches_repo ? [existing.patches_repo] : []);
    for (const repo of repos) if (!existing.patch_sources.includes(repo)) existing.patch_sources.push(repo);
    existing.patches_repo = existing.patches_repo || repos[0];
    dirty(); closeDlg(); render();
    return toast(existing.name + ' was already configured; compatible sources were refreshed.');
  }

  const id = appIdFromName(newAppInspection.name, newAppInspection.androidPackage);
  const defArch = (S.config.settings && S.config.settings.default_arch) || 'arm64-v8a';
  const appConfig = {
    id,
    name: newAppInspection.name,
    package: newAppInspection.androidPackage,
    android_package: newAppInspection.androidPackage,
    patch_package: selected.package,
    patches_repo: repos[0],
    patch_sources: repos,
    prerelease: repos.some(repo => { const s = configuredSourceForRepo(repo); return s && s.prerelease === true; }),
    arch: defArch,
    apk_arch: 'auto',
    apk_providers: ['apkmirror','uptodown'],
    apk_sources: {},
    play_store_url: /^https?:\/\/play\.google\.com\//i.test((($('n_app_play') || {}).value || '').trim()) ? (($('n_app_play') || {}).value || '').trim() : '',
    version: '',
    force: false,
    auto_patch: true,
    enable: [],
    disable: [],
    options: {}
  };
  S.config.apps.push(appConfig);

  dirty(); closeDlg(); render();
  toast(appConfig.name + ' added with ' + repos.length + ' compatible patch source(s). Save changes.');
}

function normalizeGithubRepo(value) {
  let v = String(value || '').trim();
  v = v.replace(/^https?:\/\/github\.com\//i, '');
  v = v.replace(/^git@github\.com:/i, '');
  v = v.replace(/^github\.com\//i, '');
  v = v.replace(/\.git$/i, '');
  v = v.replace(/^\/+|\/+$/g, '');
  const parts = v.split('/').filter(Boolean);
  if (parts.length < 2) return '';
  return parts.slice(0, 2).join('/');
}

async function inspectEnteredSource() {
  const repoInput = $('#n_src').value.trim();
  const repo = normalizeGithubRepo(repoInput);
  const pre = $('#sw_srcpre').classList.contains('on');
  if (!repo) return toast('Enter a valid GitHub repository, e.g. owner/repo', 1);
  const resDiv = $('#src_inspect_result');
  const addBtn = $('#btn_add_discovered');
  if (!repo) return toast('Enter owner/repo', 1);

  resDiv.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:12px 0"><i class="ms">sync</i> Inspecting repository...</div>`;
  addBtn.disabled = true;

  try {
    const rels = await gh(`https://api.github.com/repos/${repo}/releases?per_page=5`, {}, 1);
    if (!Array.isArray(rels) || !rels.length) throw new Error('No published releases found');
    const rel = rels.find(r => !r.draft && (pre || !r.prerelease)) || rels[0];
    const tag = rel.tag_name || rel.tagName;

    let patchesData = null;
    let sourceIconUrl = '';
    const iconPaths = [
      'assets/icons/icon-256.png',
      'assets/icon.png',
      'icon.png',
      'assets/icons/icon-128.png',
      'assets/icons/icon-512.png',
      'assets/icon.svg',
      'icon.svg'
    ];
    for (const path of iconPaths) {
      try {
        const ir = await gh('https://api.github.com/repos/' + repo + '/contents/' + path + '?ref=' + encodeURIComponent(tag), {}, 1);
        if (ir && ir.download_url) { sourceIconUrl = ir.download_url; break; }
      } catch(e) {}
    }
    const asset = (rel.assets || []).find(a => a.name === 'patches-list.json');
    if (asset) {
      try {
        const res = await fetch(asset.browser_download_url);
        if (res.ok) patchesData = await res.json();
      } catch(e) {}
    }

    if (!patchesData) {
      const rawUrls = [
        `https://raw.githubusercontent.com/${repo}/${tag}/patches-list.json`,
        `https://raw.githubusercontent.com/${repo}/main/patches-list.json`,
        `https://raw.githubusercontent.com/${repo}/master/patches-list.json`
      ];
      for (const u of rawUrls) {
        try {
          const res = await fetch(u);
          if (res.ok) { patchesData = await res.json(); break; }
        } catch(e) {}
      }
    }

    // Morphe's patches-list.json is normally an object:
    // { version: "...", patches: [...] }
    // Some third-party sources may expose the patch array directly, so support both.
    const patchEntries = Array.isArray(patchesData)
      ? patchesData
      : (patchesData && Array.isArray(patchesData.patches) ? patchesData.patches : []);

    const discoveredPkgs = new Set();
    const discoveredVersions = {};
    const addCompatibility = (pkg, versions) => {
      if (!pkg) return;
      const vals = Array.isArray(versions)
        ? versions
        : (versions && typeof versions === 'object'
          ? Object.values(versions).flatMap(v => Array.isArray(v) ? v : [v])
          : (versions == null ? [] : [versions]));
      discoveredPkgs.add(pkg);
      discoveredVersions[pkg] = Array.from(new Set([
        ...(discoveredVersions[pkg] || []),
        ...vals.map(v => typeof v === 'object' && v ? (v.version || '') : String(v || '')).filter(Boolean)
      ]));
    };
    patchEntries.forEach(p => {
      const cp = p && p.compatiblePackages;
      if (Array.isArray(cp)) {
        cp.forEach(x => {
          if (typeof x === 'string') addCompatibility(x, []);
          else if (x && typeof x === 'object') addCompatibility(x.packageName || x.package || x.name || '', x.versions || x.targets || []);
        });
      } else if (cp && typeof cp === 'object') {
        Object.entries(cp).forEach(([pkg, versions]) => addCompatibility(pkg, versions));
      }

      const compat = p && p.compatibility;
      if (Array.isArray(compat)) {
        compat.forEach(x => addCompatibility(
          x && (x.packageName || x.package || x.name),
          x && Array.isArray(x.targets) ? x.targets.map(t => t && t.version).filter(Boolean) : []
        ));
      } else if (compat && typeof compat === 'object') {
        Object.entries(compat).forEach(([pkg, data]) => addCompatibility(pkg, data));
      }
    });

    if (discoveredPkgs.size === 0) {
      const rLower = repo.toLowerCase();
      const rBody = (rel.body || '').toLowerCase();
      if (rLower.includes('facebook') || rBody.includes('facebook') || rBody.includes('katana')) discoveredPkgs.add('com.facebook.katana');
      if (rLower.includes('messenger') || rBody.includes('messenger') || rBody.includes('orca')) discoveredPkgs.add('com.facebook.orca');
      if (rLower.includes('tiktok') || rLower.includes('hushfeed') || rBody.includes('tiktok')) discoveredPkgs.add('com.zhiliaoapp.musically');
      if (rLower.includes('threads') || rBody.includes('threads')) discoveredPkgs.add('com.instagram.barcelona');
      if (rLower.includes('twitter') || rLower.includes('piko') || rBody.includes('twitter')) discoveredPkgs.add('com.twitter.android');
      if (rLower.includes('reddit') || rBody.includes('reddit')) discoveredPkgs.add('com.reddit.frontpage');
      if (rLower.includes('youtube') || rBody.includes('youtube')) discoveredPkgs.add('com.google.android.youtube');
    }

    const pkgList = Array.from(discoveredPkgs);
    const mppAsset = (rel.assets || []).find(a => /\.mpp$/i.test(a.name));
    if (!pkgList.length && !mppAsset) throw new Error('No Morphe patch bundle found in the selected release.');
    newSourceInspection = {
      repo, tag, prerelease: pre,
      packages: pkgList,
      versions: discoveredVersions,
      iconUrl: sourceIconUrl,
      selectedPkg: pkgList[0] || '',
      releaseName: rel.name || tag,
      patchCount: patchEntries.length || null,
      bundleAsset: mppAsset ? mppAsset.name : ''
    };

    resDiv.innerHTML = `
      <div class="card" style="background:var(--card-high);margin:8px 0">
        <b>${esc(repo)}</b>
        <div class="d" style="margin-top:4px">
          Release <b>${esc(tag)}</b>
          · ${patchEntries.length || 'Unknown'} patch(es)
          · ${pkgList.length} compatible app(s)
          ${mppAsset ? ' · .mpp bundle detected' : ''}
        </div>
      </div>
      <div style="font-size:0.8rem;color:var(--sec);margin-bottom:6px">Select an app to add this source to:</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${pkgList.map((pkg, idx) => {
          const meta = getAppMeta(pkg);
          return `
            <span class="chip ${idx===0?'p':''}" style="padding:7px 12px;cursor:pointer" data-a="select_inspected_pkg" data-pkg="${esc(pkg)}">
              ${esc(meta.name)} (${esc(pkg)})
            </span>
          `;
        }).join('')}
      </div>
      <div class="lbl" style="margin-top:10px">Custom package name (if it was not detected)</div>
      <input type="text" id="custom_inspected_pkg" placeholder="com.example.app" value="${esc(pkgList[0] || '')}">
      <div class="d" style="margin-top:8px">
        The repository will be saved as a reusable patch source. If the selected app already exists, this source will be added to its source priority instead of replacing the current source.
      </div>
    `;
    addBtn.textContent = 'Add Source + App';
    addBtn.disabled = false;
  } catch(e) {
    resDiv.innerHTML = `<div class="warnb" style="margin:8px 0">Could not inspect automatically (${esc(e.message)}). Specify package manually:</div>
      <input type="text" id="custom_inspected_pkg" placeholder="com.example.app">`;
    newSourceInspection = { repo, tag: 'latest', prerelease: pre, packages: [], versions: {}, selectedPkg: '' };
    addBtn.disabled = false;
  }
}

    if (!newSourceInspection) return;
    const pkg = ($('#custom_inspected_pkg') || {}).value?.trim() || newSourceInspection.selectedPkg;

    const parts = pkg.split('.');
    const id = (parts[parts.length - 1] || 'app').toLowerCase();
    const defArch = (S.config.settings && S.config.settings.default_arch) || 'arm64-v8a';

    S.config.sources = Array.isArray(S.config.sources) ? S.config.sources : [];
    const existingSource = S.config.sources.find(x => x.repo === newSourceInspection.repo);
    const sourceRecord = {
      repo: newSourceInspection.repo,
      enabled: existingSource ? existingSource.enabled !== false : true,
      prerelease: newSourceInspection.prerelease,
      tag: newSourceInspection.tag,
      release_name: newSourceInspection.releaseName || newSourceInspection.tag,
      patch_count: newSourceInspection.patchCount,
      icon_url: newSourceInspection.iconUrl || '',
      apps: newSourceInspection.packages.map(p => ({ package: p, name: getAppMeta(p).name })),
      last_inspected: new Date().toISOString()
    };
    if (existingSource) Object.assign(existingSource, sourceRecord);
    else S.config.sources.push(sourceRecord);

    S.config.apps = S.config.apps || [];
    let a = S.config.apps.find(x => x.id === id);
    if (!a) {
      a = {
        id, package: pkg, patches_repo: newSourceInspection.repo,
        patch_sources: [newSourceInspection.repo],
        prerelease: newSourceInspection.prerelease,
        arch: defArch, apk_arch: 'auto', version: (((newSourceInspection.versions || {})[pkg] || [])[0] || ''), force: false,
        auto_patch: true, icon_url: newSourceInspection.iconUrl || officialIconUrl({package: pkg}), enable: [], disable: [], options: {}
      };
      S.config.apps.push(a);
    } else {
      a.patch_sources = Array.isArray(a.patch_sources) ? a.patch_sources : [];
      if (!a.patch_sources.includes(newSourceInspection.repo)) a.patch_sources.push(newSourceInspection.repo);
      if (!a.patches_repo) a.patches_repo = newSourceInspection.repo;
      if (!a.version) a.version = (((newSourceInspection.versions || {})[pkg] || [])[0] || a.version || '');
      if (!a.icon_url) a.icon_url = newSourceInspection.iconUrl || officialIconUrl(a);

    dirty();
    closeDlg();
    loadLocalCatalogs().then(render);
    toast(`Source added. ${ttl(a)} now uses ${a.patch_sources.length} source(s) ✔ Save changes`);

        if ((t.dataset.v === 'all') !== !!p.enabled) {
          (t.dataset.v === 'all' ? a.enable : a.disable).push(p.name);
        }
      });
    }
    dirty(); render();
  },
  pt: t => {
    const a = app(t.dataset.id); if (!a) return;
    const cat = S.cats[a.id]; if (!cat) return;
    const p = cat.patches.find(x => x.name === t.dataset.n); if (!p) return;
    const on = !eff(a, p);
    a.enable = (a.enable || []).filter(n => n !== p.name);

    if (on !== !!p.enabled) (on ? a.enable : a.disable).push(p.name);
