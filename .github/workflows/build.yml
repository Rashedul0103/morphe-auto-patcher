name: Auto-Patcher Build

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    paths:
      - 'config.json'
      - 'build.py'
      - 'apk_providers.py'
      - 'apk_validator.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'App ID to build (leave empty for all)'
        required: false
        default: ''
        type: string
      force:
        description: 'Force rebuild even if release exists'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Web UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/index.html").read_text(encoding="utf-8-sig")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("No script block found in docs/index.html")
          Path("/tmp/patch-manager-ui.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/patch-manager-ui.js

      - name: Validate Python sources
        run: python3 -m py_compile apk_providers.py apk_validator.py build.py

      - name: Run provider regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_APP: ${{ inputs.app }}
          FORCE_BUILD: ${{ inputs.force || (github.event_name == 'push') }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 build.py

      - name: Commit Catalog
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/catalog/
          if ! git diff --cached --quiet; then
            git commit -m "Update patch catalog [skip ci]"
            git fetch origin ${{ github.ref_name }}
            if ! git rebase origin/${{ github.ref_name }}; then
              echo "Rebase conflict detected. Safely resetting and re-applying catalog."
              git rebase --abort
              git reset --soft origin/${{ github.ref_name }}
              git reset
              git add docs/catalog/
              git commit -m "Update patch catalog [skip ci]"
            fi
            git push origin ${{ github.ref_name }}
          else
            echo "No catalog changes to commit."
          fi
