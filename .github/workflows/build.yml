name: Auto-Patcher Build

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    paths:
      - 'config.json'
  workflow_dispatch:
    inputs:
      app:
        description: 'App ID to build (leave empty for all)'
        required: false
        default: ''
        type: string
      force:
        description: 'Force rebuild even if release exists'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Morphe CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo MorpheApp/morphe-desktop --pattern "*-all.jar" --clobber

      - name: Restore Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ks.bks
            echo "Keystore restored to ks.bks"
          else
            echo "::warning::KEYSTORE_B64 secret is not set. Custom APK signing key will not be used."
          fi

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_APP: ${{ inputs.app }}
          FORCE_BUILD: ${{ inputs.force || (github.event_name == 'push') }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 build.py

      - name: Commit Catalog
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/catalog/
          if ! git diff --cached --quiet; then
            git commit -m "Update patch catalog [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          else
            echo "No catalog changes to commit."
          fi
