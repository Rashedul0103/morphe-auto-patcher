name: Test Discord Failure Alerts

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which simulated failure alert to send"
        required: true
        type: choice
        options:
          - all
          - patching
          - output_validation
          - release_publishing
        default: all

permissions:
  contents: read

jobs:
  test-failure-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Exercise the actual build.py Discord alert helper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SELECTED_STAGE: ${{ inputs.stage }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import build

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK secret is missing.")

          with open("config.json", encoding="utf-8") as f:
              settings = json.load(f).get("settings", {})

          stages = {
              "patching": "SIMULATED ONLY: testing the patching-failure notification helper. No APK was patched.",
              "output_validation": "SIMULATED ONLY: testing the output-validation notification helper. No APK was built or validated.",
              "release_publishing": "SIMULATED ONLY: testing the release-publishing notification helper. No GitHub Release was created.",
          }
          selected = os.environ["SELECTED_STAGE"]
          names = list(stages) if selected == "all" else [selected]
          if any(stage not in stages for stage in names):
              raise SystemExit(f"Unknown stage selection: {selected}")

          delivered = 0
          skipped = 0
          for stage in names:
              enabled = build.discord_failure_alert_enabled(settings, stage)
              if not enabled:
                  print(f"SKIPPED {stage}: config.json setting is OFF.")
                  skipped += 1
                  continue

              try:
                  result = build.send_build_failure_alert(
                      webhook,
                      settings,
                      stage,
                      "TEST ONLY — no app",
                      "SIMULATED",
                      "not applicable",
                      stages[stage],
                  )
              except Exception as exc:
                  raise SystemExit(f"Alert helper raised an exception for {stage}: {exc}") from exc

              if not result:
                  raise SystemExit(f"Alert helper did not send the enabled {stage} notification.")
              print(f"DELIVERED {stage}: actual build.py alert helper returned successfully.")
              delivered += 1

          print(f"Finished: {delivered} actual helper alert(s) sent; {skipped} skipped because settings were OFF.")
          if delivered == 0:
              raise SystemExit("No alert was sent. Enable at least one stage in config.json.")
          PY
