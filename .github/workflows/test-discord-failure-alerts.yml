name: Test Discord Failure Alerts

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which simulated failure alert to send"
        required: true
        type: choice
        options:
          - all
          - patching
          - output_validation
          - release_publishing
        default: all
      disable_stage:
        description: "Temporarily simulate one alert switch being OFF (test only)"
        required: true
        type: choice
        options:
          - none
          - patching
          - output_validation
          - release_publishing
        default: none

permissions:
  contents: read

jobs:
  test-failure-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Exercise the actual build.py Discord alert helper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SELECTED_STAGE: ${{ inputs.stage }}
          DISABLE_STAGE: ${{ inputs.disable_stage }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import build

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK secret is missing.")

          with open("config.json", encoding="utf-8") as f:
              settings = dict(json.load(f).get("settings", {}))

          stages = {
              "patching": ("notify_patching_failure", "SIMULATED ONLY: testing the patching-failure notification helper. No APK was patched."),
              "output_validation": ("notify_output_validation_failure", "SIMULATED ONLY: testing the output-validation notification helper. No APK was built or validated."),
              "release_publishing": ("notify_release_publishing_failure", "SIMULATED ONLY: testing the release-publishing notification helper. No GitHub Release was created."),
          }
          selected = os.environ["SELECTED_STAGE"]
          disable_stage = os.environ["DISABLE_STAGE"]
          names = list(stages) if selected == "all" else [selected]
          if any(stage not in stages for stage in names):
              raise SystemExit(f"Unknown stage selection: {selected}")
          if disable_stage != "none":
              if disable_stage not in stages:
                  raise SystemExit(f"Unknown disable-stage selection: {disable_stage}")
              if disable_stage not in names:
                  raise SystemExit("To test an OFF switch, select that stage or 'all' in the stage field.")
              # Change only this in-memory test setting; config.json and website settings remain untouched.
              settings[stages[disable_stage][0]] = False
              print(f"TEST MODE: temporarily treating {disable_stage} alert as OFF in memory only.")

          delivered = 0
          skipped = 0
          for stage in names:
              setting_name, reason = stages[stage]
              enabled = build.discord_failure_alert_enabled(settings, stage)
              if not enabled:
                  result = build.send_build_failure_alert(
                      webhook, settings, stage, "TEST ONLY — no app",
                      "SIMULATED", "not applicable", reason
                  )
                  if result is not False:
                      raise SystemExit(f"OFF-switch check failed for {stage}: helper should return False without sending.")
                  print(f"PASS {stage}: OFF switch suppressed the notification.")
                  skipped += 1
                  continue

              try:
                  result = build.send_build_failure_alert(
                      webhook, settings, stage, "TEST ONLY — no app",
                      "SIMULATED", "not applicable", reason
                  )
              except Exception as exc:
                  raise SystemExit(f"Alert helper raised an exception for {stage}: {exc}") from exc

              if not result:
                  raise SystemExit(f"Alert helper did not send the enabled {stage} notification.")
              print(f"SENT {stage}: actual build.py alert helper returned successfully.")
              delivered += 1

          print(f"Finished: {delivered} enabled alert(s) attempted; {skipped} disabled alert(s) suppressed.")
          if delivered == 0:
              raise SystemExit("No enabled alerts were sent. Select a stage that is ON.")
          if disable_stage != "none" and skipped != 1:
              raise SystemExit("Expected exactly one suppressed alert for the selected OFF-switch test.")
          PY
