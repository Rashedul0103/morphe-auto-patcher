name: Research Morphe Manager Source

on:
  push:
    branches:
      - research/morphe-manager-source

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Morphe Manager source
        run: |
          rm -rf /tmp/morphe-manager-source
          mkdir -p /tmp/morphe-manager-source
          unzip -q morphe-manager-1.34.0.zip -d /tmp/morphe-manager-source
          test -n "$(find /tmp/morphe-manager-source -type f -print -quit)"
          find /tmp/morphe-manager-source -maxdepth 3 -type f | head -200

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: morphe-manager-source-extracted
          path: /tmp/morphe-manager-source
          if-no-files-found: error
          retention-days: 7
